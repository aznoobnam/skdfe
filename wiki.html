<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://api.github.com https://raw.githubusercontent.com; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>SKDFE Wiki</title>
  <style>
    :root { color-scheme: light dark; --bg:#f6f6f3; --panel:#fff; --text:#20211f; --muted:#666a64; --line:#d9dcd5; --accent:#245f45; --soft:#e7f0eb; --warn:#8a4b08; --danger:#9b2c2c; }
    @media (prefers-color-scheme:dark) { :root { --bg:#161816; --panel:#20231f; --text:#eceee9; --muted:#aeb3aa; --line:#3b4039; --accent:#8fd4ae; --soft:#263b30; --warn:#ffc06a; --danger:#ff9a9a; } }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 system-ui,sans-serif; }
    a { color:var(--accent); text-underline-offset:.18em; }
    button,input,select { font:inherit; }
    button,input,select,a { border-radius:.35rem; }
    :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
    header { position:sticky; top:0; z-index:2; background:color-mix(in srgb,var(--panel) 94%,transparent); border-bottom:1px solid var(--line); backdrop-filter:blur(8px); }
    .bar { max-width:1180px; margin:auto; padding:.7rem 1rem; display:flex; gap:.65rem; align-items:center; flex-wrap:wrap; }
    .brand { color:var(--text); font-weight:750; text-decoration:none; margin-inline-end:.35rem; }
    nav { display:flex; gap:.25rem; flex-wrap:wrap; }
    nav a { color:var(--muted); padding:.35rem .55rem; text-decoration:none; }
    nav a[aria-current="page"] { background:var(--soft); color:var(--accent); }
    .controls { display:flex; gap:.5rem; margin-inline-start:auto; flex:1; justify-content:flex-end; min-width:280px; }
    input,select,button { border:1px solid var(--line); background:var(--panel); color:var(--text); padding:.42rem .58rem; }
    input { width:min(23rem,100%); }
    button { cursor:pointer; }
    button:disabled { cursor:wait; opacity:.65; }
    main,footer { max-width:1180px; margin:auto; padding:1.15rem 1rem; }
    h1 { font-size:clamp(1.55rem,4vw,2.3rem); margin:.15rem 0 .25rem; }
    h2 { font-size:1.2rem; margin:1.5rem 0 .55rem; }
    h3 { margin:.1rem 0; font-size:1rem; }
    .muted,.key { color:var(--muted); }
    .key { font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; overflow-wrap:anywhere; }
    .status { margin:.75rem 0 1rem; padding:.65rem .8rem; border:1px solid var(--line); border-inline-start:4px solid var(--accent); background:var(--panel); }
    .status.warn { border-inline-start-color:var(--warn); }
    .status.error { border-inline-start-color:var(--danger); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:.7rem; }
    .card { display:block; min-width:0; padding:.8rem; border:1px solid var(--line); background:var(--panel); text-decoration:none; color:var(--text); }
    a.card:hover { border-color:var(--accent); }
    .card p { margin:.3rem 0 0; }
    .count { font-size:1.7rem; font-weight:750; color:var(--accent); }
    .badge { display:inline-block; margin:.2rem .25rem .1rem 0; padding:.08rem .4rem; border-radius:999px; background:var(--soft); color:var(--accent); font-size:.76rem; }
    .badge.warn { color:var(--warn); }
    .badge.error { color:var(--danger); }
    .stack { display:grid; gap:.55rem; }
    .field { padding:.7rem .8rem; border:1px solid var(--line); background:var(--panel); }
    .field dt { color:var(--muted); font-size:.8rem; }
    .field dd { margin:.12rem 0 0; white-space:pre-wrap; overflow-wrap:anywhere; }
    .section-head { display:flex; align-items:end; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
    .empty { padding:2rem 1rem; text-align:center; color:var(--muted); border:1px dashed var(--line); }
    footer { color:var(--muted); font-size:.85rem; border-top:1px solid var(--line); }
    [hidden] { display:none!important; }
    @media (max-width:760px) { .controls { order:3; min-width:100%; justify-content:stretch; } input { flex:1; min-width:0; } select { max-width:42%; } .bar { padding:.55rem .7rem; } main,footer { padding-inline:.7rem; } }
    @media (prefers-reduced-motion:no-preference) { a,button { transition:border-color .12s,background-color .12s; } }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="#/">SKDFE Wiki</a>
      <nav aria-label="Wiki pages">
        <a href="#/" data-page="home">Home</a>
        <a href="#/characters" data-page="characters">Characters</a>
        <a href="#/pets" data-page="pets">Pets</a>
        <a href="#/weapons" data-page="weapons">Weapons</a>
        <a href="#/materials" data-page="materials">Materials</a>
        <a href="#/blueprints" data-page="blueprints">Blueprints</a>
        <a href="#/enemies" data-page="enemies">Enemies</a>
      </nav>
      <div class="controls">
        <label hidden for="search">Search</label>
        <input id="search" type="search" placeholder="Search wiki" autocomplete="off">
        <label hidden for="language">Language</label>
        <select id="language" aria-label="Language"></select>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </div>
  </header>
  <main id="app" tabindex="-1"><p>Loading wiki…</p></main>
  <footer>
    <div id="status" class="status" role="status" aria-live="polite">Starting…</div>
    <div id="source"></div>
  </footer>
<script>
'use strict';

const REPO = 'aznoobnam/skdfe';
const REPO_URL = `https://github.com/${REPO}`;
const API_URL = `https://api.github.com/repos/${REPO}/commits/main`;
const FILES = ['version.json','char_code_name.json','pet_code_name.json','weapon_full.json','weapon_skins.json','item.json','I2language.csv'];
const BLUEPRINT_FILE = 'items.decrypted.csv';
const ENEMY_FILE = 'enemies.decrypted.csv';
const LIMITS = {'I2language.csv':30_000_000,'items.decrypted.csv':1_000_000,'enemies.decrypted.csv':1_000_000,'item.json':2_000_000,'weapon_skins.json':2_000_000,'weapon_full.json':2_000_000,'char_code_name.json':100_000,'pet_code_name.json':100_000,'version.json':10_000};
const ENEMY_HEADER = ['Key','Path','AssetBundle','LevelKey','EnemyId','SummonedEnemy','Intensive','CellarSprite','Hp','Speed','SpeedRate','Critical','IsBoss','ExtraAssetBundle','BossBgm','BossRoom','BossWeapon','SubspeciesBoss','DoubleBosses','DropOffsetX','DropOffsetY','Drops','DropGroups'];
const ENEMY_SCHEMA = ['string','string','string','string','string','bool','bool','SpriteAtlasData','int','float','float','int','bool','string','string','string','string','string','Dictionary<string, int>','float','float','List<Enemy.EnemyDropInfo>','List<Enemy.EnemyDropGroup>'];
const LANGUAGES = ['English','Chinese (Traditional)','Chinese (Simplified)','Japanese','Korean','Spanish','German','Portuguese','French','Russian','Polish','Persian','Arabic','Thai','Vietnamese'];
const RTL = new Set(['Persian','Arabic']);
const DB_NAME = 'skdfe-wiki-v1';
const DB_VERSION = 2;
const CAN_PERSIST = location.protocol !== 'file:' && typeof indexedDB !== 'undefined';
const REFRESH_MS = 30 * 60 * 1000;
const MAX_RESULTS = 300;

const app = document.querySelector('#app');
const statusBox = document.querySelector('#status');
const sourceBox = document.querySelector('#source');
const searchInput = document.querySelector('#search');
const languageSelect = document.querySelector('#language');
const refreshButton = document.querySelector('#refresh');
const navLinks = [...document.querySelectorAll('nav a')];

const state = {
  snapshot:null, model:null, language:'English', sourceMode:'none', message:'Starting…',
  statusKind:'', refreshing:false, lastCheck:0, search:'', db:null
};

function el(tag, attrs={}, ...children) {
  const node = document.createElement(tag);
  for (const [key,value] of Object.entries(attrs)) {
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key === 'hidden') node.hidden = value;
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) if (child != null) node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  return node;
}

function setStatus(message, kind='') {
  state.message = message;
  state.statusKind = kind;
  statusBox.textContent = message;
  statusBox.className = `status${kind ? ` ${kind}` : ''}`;
}

function parseCSV(text) {
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
  const rows=[];
  let row=[], field='', quoted=false, closed=false;
  for (let i=0; i<text.length; i++) {
    const ch=text[i];
    if (quoted) {
      if (ch === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else { quoted=false; closed=true; }
      } else field += ch;
      continue;
    }
    if (closed) {
      if (ch === ',') { row.push(field); field=''; closed=false; }
      else if (ch === '\r' || ch === '\n') { row.push(field); rows.push(row); row=[]; field=''; closed=false; if (ch === '\r' && text[i+1] === '\n') i++; }
      else throw new Error(`Unexpected character after closing quote at offset ${i}`);
    } else if (ch === '"') {
      if (field) throw new Error(`Unexpected quote at offset ${i}`);
      quoted=true;
    } else if (ch === ',') { row.push(field); field=''; }
    else if (ch === '\r' || ch === '\n') { row.push(field); rows.push(row); row=[]; field=''; if (ch === '\r' && text[i+1] === '\n') i++; }
    else field += ch;
  }
  if (quoted) throw new Error('Unclosed quoted CSV field');
  if (closed || field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function parseLocalization(text) {
  const rows = parseCSV(text);
  const expected = ['id', ...LANGUAGES];
  if (!rows.length || rows[0].length !== expected.length || rows[0].some((value,index) => value !== expected[index])) throw new Error('Unexpected localization CSV header');
  if (rows.length < 1000) throw new Error(`Localization CSV too small: ${rows.length - 1} records`);
  const entries = new Map();
  for (let i=1; i<rows.length; i++) {
    const row=rows[i];
    if (row.length !== expected.length) throw new Error(`Localization row ${i+1} has ${row.length} fields`);
    const id=row[0].trim();
    if (!id) throw new Error(`Localization row ${i+1} has an empty ID`);
    if (entries.has(id)) throw new Error(`Duplicate localization ID: ${id}`);
    entries.set(id,row.slice(1));
  }
  for (const key of ['Character0_name_skin0','Pet_name_0','weapon/weapon_000']) if (!entries.has(key)) throw new Error(`Missing localization sentinel: ${key}`);
  return entries;
}

function enemyType(key,isBoss) { return isBoss?'Boss':key.startsWith('ex_')?'Elite':'Normal'; }

function parseEnemyDrop(value,name) {
  assertObject(value,name); assertObject(value.item,`${name}.item`);
  if (typeof value.item.item!=='string' || !value.item.item) throw new Error(`${name} has an invalid item ID`);
  if (typeof value.probability!=='number' || !Number.isFinite(value.probability) || value.probability<0) throw new Error(`${name} has an invalid probability`);
  if (typeof value.guaranteeDrop!=='boolean') throw new Error(`${name} has an invalid guaranteeDrop`);
  if (!Number.isSafeInteger(value.guaranteeDropCount) || value.guaranteeDropCount<0) throw new Error(`${name} has an invalid guaranteeDropCount`);
  if (!Array.isArray(value.conditions)) throw new Error(`${name} has invalid conditions`);
  value.conditions.forEach((condition,index)=>assertObject(condition,`${name}.conditions[${index}]`));
  return {item:value.item.item,probability:value.probability,guaranteeDrop:value.guaranteeDrop,guaranteeDropCount:value.guaranteeDropCount,conditions:value.conditions};
}

function parseEnemyCSV(text) {
  const rows=parseCSV(text);
  if (rows.length<3 || rows[0]?.length!==ENEMY_HEADER.length || ENEMY_HEADER.some((value,index)=>rows[0][index]!==value)) throw new Error('Unexpected enemies CSV header');
  if (rows[1]?.length!==ENEMY_SCHEMA.length || ENEMY_SCHEMA.some((value,index)=>rows[1][index]!==value)) throw new Error('Unexpected enemies CSV schema row');
  const enemies=new Map();
  for (let index=2; index<rows.length; index++) {
    const row=rows[index];
    if (row.length!==ENEMY_HEADER.length) throw new Error(`Enemies CSV row ${index+1} has ${row.length} fields`);
    const key=row[0].trim(), enemyId=row[4].trim(), isBossText=row[12], bossWeapon=row[16].trim(), subspeciesBoss=row[17].trim();
    if (!key) throw new Error(`Enemies CSV row ${index+1} has an empty Key`);
    if (enemies.has(key)) throw new Error(`Duplicate enemy Key: ${key}`);
    if (isBossText!=='True' && isBossText!=='False') throw new Error(`Enemy ${key} has an invalid IsBoss`);
    const drops=parseJSON(row[21],`Enemy ${key} Drops`), groups=parseJSON(row[22],`Enemy ${key} DropGroups`);
    if (!Array.isArray(drops) || !Array.isArray(groups)) throw new Error(`Enemy ${key} has invalid drops`);
    const parsedDrops=drops.map((drop,dropIndex)=>parseEnemyDrop(drop,`Enemy ${key} Drops[${dropIndex}]`));
    const dropGroups=groups.map((group,groupIndex)=>{
      const name=`Enemy ${key} DropGroups[${groupIndex}]`; assertObject(group,name);
      if (typeof group.probability!=='number' || !Number.isFinite(group.probability) || group.probability<0) throw new Error(`${name} has an invalid probability`);
      if (typeof group.randomOrder!=='boolean' || !Array.isArray(group.Drops)) throw new Error(`${name} is invalid`);
      return {probability:group.probability,randomOrder:group.randomOrder,drops:group.Drops.map((drop,dropIndex)=>parseEnemyDrop(drop,`${name}.Drops[${dropIndex}]`))};
    });
    const isBoss=isBossText==='True';
    enemies.set(key,{type:'enemies',key,enemyId,isBoss,enemyType:enemyType(key,isBoss),bossWeapon,subspeciesBoss,drops:parsedDrops,dropGroups});
  }
  return enemies;
}

function parseBlueprintCSV(text) {
  const rows=parseCSV(text);
  const header=['Key','Type','SubType','DataStr'];
  const schema=['string','string','string','string'];
  if (rows.length<3 || header.some((value,index)=>rows[0]?.[index]!==value) || rows[0].length!==4) throw new Error('Unexpected items CSV header');
  if (schema.some((value,index)=>rows[1]?.[index]!==value) || rows[1].length!==4) throw new Error('Unexpected items CSV schema row');
  const keys=new Set(), blueprints=new Map();
  for (let index=2; index<rows.length; index++) {
    const row=rows[index];
    if (row.length!==4) throw new Error(`Items CSV row ${index+1} has ${row.length} fields`);
    const [key,type,subType,dataText]=row;
    if (!key.trim()) throw new Error(`Items CSV row ${index+1} has an empty Key`);
    if (keys.has(key)) throw new Error(`Duplicate item Key: ${key}`);
    keys.add(key);
    if (type!=='BluePrint' || subType!=='Blueprint') continue;
    const data=parseJSON(dataText,`items CSV ${key}`);
    assertObject(data,`items CSV ${key} DataStr`);
    if (data.Name!==key) throw new Error(`Blueprint ${key} Name does not match Key`);
    if (typeof data.ItemName!=='string' || !data.ItemName) throw new Error(`Blueprint ${key} has an invalid ItemName`);
    if (!Number.isInteger(data.BlueprintType)) throw new Error(`Blueprint ${key} has an invalid BlueprintType`);
    for (const field of ['Hero','SkinIndex','SkillIndex']) if (!Number.isSafeInteger(data[field]) || data[field]<0) throw new Error(`Blueprint ${key} has an invalid ${field}`);
    if (typeof data.Localization!=='string') throw new Error(`Blueprint ${key} has an invalid Localization`);
    if (!Array.isArray(data.ResearchMaterials)) throw new Error(`Blueprint ${key} has invalid ResearchMaterials`);
    const seenMaterials=new Set();
    const materials=data.ResearchMaterials.map((entry,materialIndex)=>{
      assertObject(entry,`Blueprint ${key} ResearchMaterials[${materialIndex}]`);
      if (typeof entry.item!=='string' || !entry.item) throw new Error(`Blueprint ${key} has an invalid research material ID`);
      if (!Number.isSafeInteger(entry.num) || entry.num<=0) throw new Error(`Blueprint ${key} has an invalid research quantity`);
      if (seenMaterials.has(entry.item)) throw new Error(`Blueprint ${key} repeats research material ${entry.item}`);
      seenMaterials.add(entry.item);
      return {item:entry.item,num:entry.num};
    });
    blueprints.set(key,{itemId:data.ItemName,blueprintType:data.BlueprintType,hero:data.Hero,skinIndex:data.SkinIndex,skillIndex:data.SkillIndex,localization:data.Localization,materials});
  }
  return blueprints;
}

function blueprintLocalizationKey(id,row) {
  switch (row.blueprintType) {
    case 0: case 1: return row.itemId.replace(/_skin_(\d+)$/,'_skin_name_$1');
    case 2: return row.itemId;
    case 3: return row.localization;
    case 4: return `Character${row.hero}_skill_${row.skillIndex}_name`;
    case 5: return `Character${row.hero}_name_skin${row.skinIndex}`;
    case 6: case 7: return `weapon/${row.itemId}`;
    case 8: {
      const target=id.replace(/^blueprint_evolution_/,'');
      if (target===id) throw new Error(`Evolution blueprint ${id} has an invalid ID`);
      return `weapon/${target}`;
    }
    default: throw new Error(`Blueprint ${id} has unsupported type ${row.blueprintType}`);
  }
}

function parseJSON(raw, name) {
  try { return JSON.parse(raw); }
  catch (error) { throw new Error(`${name}: ${error.message}`); }
}

function assertObject(value, name) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error(`${name} must be an object`);
}

function characterWeaponIds(code) {
  const starting=code==='Knight'?'weapon_000':`weapon_init_${code.toLowerCase()}`;
  return {starting,upgraded:`${starting}x`};
}

function parseWeapons(value) {
  assertObject(value,'weapon_full.json');
  if (!Array.isArray(value.weapons)) throw new Error('weapon_full.json.weapons must be an array');
  const ids=new Set();
  return value.weapons.map((weapon,index)=>{
    const source=`weapon_full.json.weapons[${index}]`;
    assertObject(weapon,source);
    if (typeof weapon.name!=='string' || !weapon.name) throw new Error(`${source} has an invalid name`);
    if (!Number.isSafeInteger(weapon.level) || weapon.level<0) throw new Error(`${source} has an invalid level`);
    if (typeof weapon.type!=='string' || !weapon.type) throw new Error(`${source} has an invalid type`);
    if (ids.has(weapon.name)) throw new Error(`Duplicate weapon name: ${weapon.name}`);
    ids.add(weapon.name);
    return {code:weapon.name,english:typeof weapon.title==='string'?weapon.title:'',level:weapon.level,weaponType:weapon.type};
  });
}

function buildModel(snapshot) {
  const raw=snapshot.files;
  if (!raw || FILES.some(name => typeof raw[name] !== 'string')) throw new Error('Snapshot files are incomplete');
  const version=parseJSON(raw['version.json'],'version.json');
  const charCodes=parseJSON(raw['char_code_name.json'],'char_code_name.json');
  const petCodes=parseJSON(raw['pet_code_name.json'],'pet_code_name.json');
  const weapons=parseWeapons(parseJSON(raw['weapon_full.json'],'weapon_full.json'));
  const weaponSkins=parseJSON(raw['weapon_skins.json'],'weapon_skins.json');
  const items=parseJSON(raw['item.json'],'item.json');
  if (!version || typeof version.version !== 'string') throw new Error('version.json lacks version string');
  if (!Array.isArray(charCodes) || charCodes.some(v => typeof v !== 'string')) throw new Error('char_code_name.json must be a string array');
  if (!Array.isArray(petCodes) || petCodes.some(v => typeof v !== 'string')) throw new Error('pet_code_name.json must be a string array');
  assertObject(weaponSkins,'weapon_skins.json'); assertObject(weaponSkins.weapons,'weapon_skins.json.weapons'); assertObject(items,'item.json'); assertObject(items.material,'item.json.material'); assertObject(items.blueprint,'item.json.blueprint');
  if (!/^[0-9a-f]{40}$/.test(snapshot.sha)) throw new Error('Snapshot SHA is invalid');
  const i18n=parseLocalization(raw['I2language.csv']);
  const keys=[...i18n.keys()];

  const skinIds=new Map(), skillIds=new Map(), petSkillIds=new Map();
  for (const key of keys) {
    let match=key.match(/^Character(\d+)_name_skin(\d+)$/);
    if (match) { const id=Number(match[1]); if (!skinIds.has(id)) skinIds.set(id,new Set()); skinIds.get(id).add(Number(match[2])); continue; }
    match=key.match(/^Character(\d+)_skill_(\d+)_(name|info|x)$/);
    if (match) { const id=Number(match[1]); if (!skillIds.has(id)) skillIds.set(id,new Set()); skillIds.get(id).add(Number(match[2])); continue; }
    match=key.match(/^pet_(\d+)_skill_(\d+)_(name|desc)$/);
    if (match) { const id=Number(match[1]); if (!petSkillIds.has(id)) petSkillIds.set(id,new Set()); petSkillIds.get(id).add(Number(match[2])); }
  }

  const characters=charCodes.map((code,id) => ({type:'characters',id,code,...characterWeaponIds(code),skinIds:[...(skinIds.get(id)||[])].sort((a,b)=>a-b),skillIds:[...(skillIds.get(id)||[])].sort((a,b)=>a-b)}));
  const pets=petCodes.map((code,id) => ({type:'pets',id,code,skillIds:[...(petSkillIds.get(id)||[])].sort((a,b)=>a-b)}));
  const evolutionIds=new Set(Array.isArray(items.blueprint?.evolution) ? items.blueprint.evolution.map(id => id.replace(/^blueprint_evolution_/,'')) : []);
  const weaponEntities=weapons.map(weapon => ({type:'weapons',...weapon,skinIds:[...new Set(weaponSkins.weapons[weapon.code]?.UnlockedSkins || [])].sort(naturalCompare),hasEvolution:evolutionIds.has(weapon.code)||i18n.has(`desc_evolution_${weapon.code}`)})).sort((a,b)=>naturalCompare(a.code,b.code));
  const weaponIds=new Set(weaponEntities.map(weapon=>weapon.code));
  for (const character of characters) for (const id of [character.starting,character.upgraded]) {
    if (!weaponIds.has(id) || !i18n.has(`weapon/${id}`)) throw new Error(`Character ${character.code} starting weapon is missing: ${id}`);
  }
  const materials=[], materialIds=new Set();
  for (const [group,values] of Object.entries(items.material)) {
    if (!Array.isArray(values)) throw new Error(`item.json material.${group} must be an array`);
    for (const id of values) {
      if (typeof id!=='string' || !id) throw new Error(`item.json material.${group} contains an invalid ID`);
      if (materialIds.has(id)) throw new Error(`Duplicate material ID: ${id}`);
      materialIds.add(id); materials.push({type:'materials',id,group});
    }
  }
  materials.sort((a,b)=>naturalCompare(a.id,b.id));

  const blueprintIndex=[], blueprintIds=new Set();
  for (const [group,values] of Object.entries(items.blueprint)) {
    if (!Array.isArray(values)) throw new Error(`item.json blueprint.${group} must be an array`);
    for (const id of values) {
      if (typeof id!=='string' || !id) throw new Error(`item.json blueprint.${group} contains an invalid ID`);
      if (blueprintIds.has(id)) throw new Error(`Duplicate blueprint ID: ${id}`);
      blueprintIds.add(id); blueprintIndex.push({id,group});
    }
  }
  const blueprintRows=typeof raw[BLUEPRINT_FILE]==='string'?parseBlueprintCSV(raw[BLUEPRINT_FILE]):null;
  let blueprints=null;
  if (blueprintRows) {

  if (!state.snapshot) { sourceBox.append('Source: ',link); return; }
  const commit=el('a',{href:`${REPO_URL}/tree/${state.snapshot.sha}`,target:'_blank',rel:'noopener noreferrer',text:state.snapshot.sha.slice(0,12)});
  sourceBox.append('Source: ',link,' · commit ',commit,' · game ',state.model?.version || '?',' · ',state.sourceMode);
}

function render() {
  document.documentElement.lang=languageCode(state.language);
  document.documentElement.dir=RTL.has(state.language)?'rtl':'ltr';
  searchInput.value=state.search;
  const page=currentPage();
  for (const link of navLinks) link.toggleAttribute('aria-current',link.dataset.page===page || (page==='home'&&link.dataset.page==='home'));
  updateSource();
  if (!state.model) return;
  const parts=routeParts(); let view;
  if (!parts.length) view=renderHome();
  else if (parts[0]==='characters') view=parts.length>1?renderCharacter(state.model.characters.find(v=>v.id===Number(parts[1]))):renderList('Characters',state.model.characters);
  else if (parts[0]==='pets') view=parts.length>1?renderPet(state.model.pets.find(v=>v.id===Number(parts[1]))):renderList('Pets',state.model.pets);
  else if (parts[0]==='weapons') view=parts.length>1?renderWeapon(state.model.weapons.find(v=>v.code===parts[1])):renderList('Weapons',state.model.weapons);
  else if (parts[0]==='materials') view=parts.length>1?renderMaterial(state.model.materials.find(v=>v.id===parts[1])):renderList('Materials',state.model.materials);
  else if (parts[0]==='blueprints') view=!state.model.blueprints?blueprintsUnavailable():parts.length>1?renderBlueprint(state.model.blueprints.find(v=>v.id===parts[1])):renderList('Blueprints',state.model.blueprints);
  else if (parts[0]==='enemies') view=!state.model.enemies?enemiesUnavailable():parts.length>1?renderEnemy(state.model.enemies.find(v=>v.key===parts[1])):renderList('Enemies',state.model.enemies);
  else view=notFound();
  app.replaceChildren(view);
  document.title=`${parts.length ? (view.querySelector('h1')?.textContent || 'Wiki') : 'SKDFE Wiki'} · SKDFE`;
}

function languageCode(language) {
  return {'English':'en','Chinese (Traditional)':'zh-Hant','Chinese (Simplified)':'zh-Hans','Japanese':'ja','Korean':'ko','Spanish':'es','German':'de','Portuguese':'pt','French':'fr','Russian':'ru','Polish':'pl','Persian':'fa','Arabic':'ar','Thai':'th','Vietnamese':'vi'}[language] || 'en';
}

function chooseLanguage() {
  const requested=new URL(location.href).searchParams.get('lang');
  if (LANGUAGES.includes(requested)) return requested;
  const prefs=navigator.languages || [navigator.language];
  for (const pref of prefs) {
    const base=pref.toLowerCase();
    if (base.startsWith('zh-')) return /(?:hans|cn|sg)(?:-|$)/.test(base)?'Chinese (Simplified)':'Chinese (Traditional)';
    const found=LANGUAGES.find(lang=>languageCode(lang).toLowerCase()===base || languageCode(lang).toLowerCase().split('-')[0]===base.split('-')[0]);
    if (found) return found;
  }
  return 'English';
}

function setLanguage(language) {
  state.language=language;
  if (location.protocol !== 'file:') { const url=new URL(location.href); url.searchParams.set('lang',language); history.replaceState(null,'',url.pathname+url.search+url.hash); }
  render();
}

function requestResult(request) { return new Promise((resolve,reject)=>{ request.onsuccess=()=>resolve(request.result); request.onerror=()=>reject(request.error); }); }
function transactionDone(tx) { return new Promise((resolve,reject)=>{ tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error || new Error('IndexedDB transaction aborted')); }); }

function openDatabase() {
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(DB_NAME,DB_VERSION);
    request.onupgradeneeded=()=>{ const db=request.result; if (!db.objectStoreNames.contains('snapshots')) db.createObjectStore('snapshots',{keyPath:'sha'}); if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta'); };
    request.onsuccess=()=>resolve(request.result); request.onerror=()=>reject(request.error);
  });
}

async function readCache() {
  if (!state.db) return null;
  const tx=state.db.transaction(['meta','snapshots'],'readonly'), meta=tx.objectStore('meta'), snapshots=tx.objectStore('snapshots');
  const pointers=await requestResult(meta.get('pointers')) || {};
  for (const sha of [pointers.current,pointers.previous]) {
    if (!sha) continue;
    const snapshot=await requestResult(snapshots.get(sha));
    if (!snapshot) continue;
    try { return {snapshot,model:buildModel(snapshot),slot:sha===pointers.current?'cache-current':'cache-previous'}; }
    catch (error) { console.warn(`Ignoring invalid cached snapshot ${sha}`,error); }
  }
  await transactionDone(tx);
  return null;
}

async function saveCache(snapshot) {
  if (!state.db) throw new Error('IndexedDB unavailable');
  const readTx=state.db.transaction('meta','readonly');
  const old=await requestResult(readTx.objectStore('meta').get('pointers')) || {};
  await transactionDone(readTx);
  const previous=old.current && old.current!==snapshot.sha ? old.current : old.previous;
  const keep=new Set([snapshot.sha,previous].filter(Boolean));
  const tx=state.db.transaction(['meta','snapshots'],'readwrite'), meta=tx.objectStore('meta'), snapshots=tx.objectStore('snapshots');
  snapshots.put(snapshot);
  meta.put({current:snapshot.sha,previous},'pointers');
  const keys=await requestResult(snapshots.getAllKeys());
  for (const key of keys) if (!keep.has(key)) snapshots.delete(key);
  await transactionDone(tx);
}

async function fetchWithLimit(url,limit,accept='text/plain',optional=false) {
  const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),30000);
  try {
    const response=await fetch(url,{headers:{Accept:accept},signal:controller.signal,cache:'no-store'});
    if (optional && response.status===404) return null;
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    const declared=Number(response.headers.get('content-length') || 0);
    if (declared>limit) throw new Error(`Response exceeds ${limit} bytes`);
    const bytes=await response.arrayBuffer();
    if (bytes.byteLength>limit) throw new Error(`Response exceeds ${limit} bytes`);
    return new TextDecoder().decode(bytes);
  } finally { clearTimeout(timer); }
}

async function fetchLatestSha() {
  const text=await fetchWithLimit(API_URL,1_000_000,'application/vnd.github+json');
  const data=parseJSON(text,'GitHub commit response'), sha=String(data.sha||'').toLowerCase();
  if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('GitHub returned an invalid main-branch SHA');
  return sha;
}

async function downloadSnapshot(sha) {
  const base=`https://raw.githubusercontent.com/${REPO}/${sha}/`;
  const optional=[BLUEPRINT_FILE,ENEMY_FILE];
  const values=await Promise.all([...FILES.map(async name=>[name,await fetchWithLimit(base+name,LIMITS[name])]),...optional.map(async name=>[name,await fetchWithLimit(base+name,LIMITS[name],'text/plain',true)])]);
  return {sha,fetchedAt:new Date().toISOString(),blueprintFileChecked:true,enemyFileChecked:true,files:Object.fromEntries(values.filter(([,value])=>value!==null))};
}

async function refresh(force=false) {
  if (state.refreshing) return;
  if (!force && Date.now()-state.lastCheck<REFRESH_MS) return;
  state.refreshing=true; refreshButton.disabled=true; setStatus('Checking latest main-branch commit…');
  try {
    const sha=await fetchLatestSha(); state.lastCheck=Date.now();
    if (state.snapshot?.sha===sha && state.snapshot.blueprintFileChecked && state.snapshot.enemyFileChecked) { state.sourceMode=state.sourceMode.startsWith('cache')?'cache, current':'network, current'; setStatus(`Current · game ${state.model.version} · ${sha.slice(0,12)}`); updateSource(); return; }
    setStatus('Downloading and validating the latest data…');
    const snapshot=await downloadSnapshot(sha), model=buildModel(snapshot);
    state.snapshot=snapshot; state.model=model; state.sourceMode='network'; render();
    if (!CAN_PERSIST) setStatus(`Updated live · game ${model.version} · ${sha.slice(0,12)}`);
    else try { await saveCache(snapshot); setStatus(`Updated and cached · game ${model.version} · ${sha.slice(0,12)}`); }
    catch (error) { console.warn('Fresh data could not be cached',error); setStatus(`Updated live; cache unavailable · ${error.message}`,'warn'); }
    updateSource();
  } catch (error) {
    console.error('Refresh failed',error);
    if (state.model) setStatus(`Using last valid data · refresh failed: ${error.message}`,'warn');
    else setStatus(`No wiki data available · ${error.message}`,'error');
  } finally { state.refreshing=false; refreshButton.disabled=false; }
}

function runChecks() {
  const rows=parseCSV('﻿a,b,c\r\n1,"two, too","quote ""ok"""\n2,"line\nwrap",');
  if (rows.length!==3 || rows[1][1]!=='two, too' || rows[1][2]!=='quote "ok"' || rows[2][1]!=='line\nwrap' || rows[2][2]!=='') throw new Error('CSV self-check failed');
  let rejected=false; try { parseCSV('a,"broken'); } catch { rejected=true; } if (!rejected) throw new Error('Malformed CSV self-check failed');
  if (!/^\{([A-Za-z][A-Za-z0-9_./-]*)\}$/.test('{boss18}') || /^\{([A-Za-z][A-Za-z0-9_./-]*)\}$/.test('{0}') || formatTemplate('[{}] Skin Fragment','Knight')!=='[Knight] Skin Fragment') throw new Error('Localization self-check failed');
  const data='{"Name":"blueprint_test","ItemName":"weapon_006","BlueprintType":7,"Hero":0,"SkinIndex":0,"SkillIndex":0,"Localization":"","ResearchMaterials":[{"item":"material_gem","num":400}]}'.replaceAll('"','""');
  const blueprint=parseBlueprintCSV(`Key,Type,SubType,DataStr\nstring,string,string,string\nblueprint_test,BluePrint,Blueprint,"${data}"`).get('blueprint_test');
  if (blueprint.itemId!=='weapon_006' || blueprint.materials[0].num!==400 || blueprintLocalizationKey('blueprint_weapon_223',{blueprintType:7,itemId:'weapon_223'})!=='weapon/weapon_223' || blueprintLocalizationKey('blueprint_evolution_weapon_404',{blueprintType:8})!=='weapon/weapon_404') throw new Error('Blueprint self-check failed');
  rejected=false; try { parseBlueprintCSV(`Key,Type,SubType,DataStr\nstring,string,string,string\nwrong,BluePrint,Blueprint,"${data}"`); } catch { rejected=true; } if (!rejected) throw new Error('Blueprint validation self-check failed');
  if ((location.protocol==='file:' && CAN_PERSIST) || (location.protocol!=='file:' && typeof indexedDB!=='undefined' && !CAN_PERSIST)) throw new Error('Persistence capability self-check failed');
  const parsedWeapons=parseWeapons({weapons:[{name:'weapon_test',title:'Test',level:2,type:'Pistol'}]});
  if (parsedWeapons.length!==1 || parsedWeapons[0].code!=='weapon_test' || parsedWeapons[0].level!==2 || parsedWeapons[0].weaponType!=='Pistol') throw new Error('Weapon parsing self-check failed');
  rejected=false; try { parseWeapons({weapons:[{name:'weapon_test',level:-1,type:'Pistol'}]}); } catch { rejected=true; } if (!rejected) throw new Error('Weapon validation self-check failed');
  const knightWeapons=characterWeaponIds('Knight'), chefWeapons=characterWeaponIds('LadyChef');
  if (knightWeapons.starting!=='weapon_000' || knightWeapons.upgraded!=='weapon_000x' || chefWeapons.starting!=='weapon_init_ladychef' || chefWeapons.upgraded!=='weapon_init_ladychefx' || chefWeapons.starting===chefWeapons.upgraded) throw new Error('Character weapon self-check failed');
  const drop={item:{item:'material_test'},probability:150,guaranteeDrop:true,guaranteeDropCount:2,conditions:[{type:1}]};
  const group={probability:200,randomOrder:false,Drops:[drop]}, enemyRow=Array(23).fill('');
  Object.assign(enemyRow,{0:'ex_test',4:'e_test',12:'True',21:JSON.stringify([drop]),22:JSON.stringify([group])});
  const csvCell=value=>`"${String(value).replaceAll('"','""')}"`, enemy=parseEnemyCSV(`${ENEMY_HEADER.join(',')}\n${ENEMY_SCHEMA.map(csvCell).join(',')}\n${enemyRow.map(csvCell).join(',')}`).get('ex_test');
  if (enemy.enemyType!=='Boss' || enemy.drops[0].probability!==150 || enemy.dropGroups[0].drops[0].guaranteeDropCount!==2 || enemy.drops[0].conditions[0].type!==1 || enemyType('ex_test',false)!=='Elite' || enemyType('e_test',false)!=='Normal') throw new Error('Enemy self-check failed');
  rejected=false; try { const bad=[...enemyRow]; bad[12]='true'; parseEnemyCSV(`${ENEMY_HEADER.join(',')}\n${ENEMY_SCHEMA.map(csvCell).join(',')}\n${bad.map(csvCell).join(',')}`); } catch { rejected=true; } if (!rejected) throw new Error('Enemy validation self-check failed');
  const probe=el('div',{text:'<img src=x onerror=alert(1)>'}); if (probe.children.length || probe.textContent[0]!=='<') throw new Error('Safe rendering self-check failed');
}

async function init() {
  try { runChecks(); }
  catch (error) { console.error(error); setStatus(`Internal self-check failed: ${error.message}`,'error'); app.replaceChildren(el('p',{text:'Wiki initialization stopped.'})); return; }
  state.language=chooseLanguage();
  for (const language of LANGUAGES) languageSelect.append(el('option',{value:language,text:language}));
  languageSelect.value=state.language;
  if (CAN_PERSIST) {
    try { state.db=await openDatabase(); }
    catch (error) { console.warn('IndexedDB unavailable',error); }
  }
  try {
    const cached=await readCache();
    if (cached) { state.snapshot=cached.snapshot; state.model=cached.model; state.sourceMode=cached.slot; setStatus(`Loaded cached game ${cached.model.version}; checking for updates…`,'warn'); render(); }
  } catch (error) { console.warn('Cache read failed',error); }
  updateSource();
  await refresh(true);
}

searchInput.addEventListener('input',()=>{ state.search=searchInput.value; render(); });
languageSelect.addEventListener('change',()=>setLanguage(languageSelect.value));
refreshButton.addEventListener('click',()=>refresh(true));
window.addEventListener('hashchange',()=>{ state.search=''; render(); app.focus({preventScroll:true}); });
window.addEventListener('online',()=>refresh());
document.addEventListener('visibilitychange',()=>{ if (!document.hidden) refresh(); });
setInterval(()=>{ if (!document.hidden) refresh(); },REFRESH_MS);
init();
</script>

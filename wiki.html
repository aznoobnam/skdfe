  <title>SKDFE Wiki</title>
  <style>
:root {
  --font-display: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

  /* Strict 4-pt Spacing Scale */
  --space-3xs: 0.125rem;
  --space-2xs: 0.25rem;
  --space-xs: 0.5rem;
  --space-sm: 0.75rem;
  --space-md: 1rem;
  --space-lg: 1.5rem;
  --space-xl: 2rem;
  --space-2xl: 3rem;
  --space-3xl: 4.5rem;

  /* Radius — Utilitarian crisp geometry */
  --radius-none: 0px;
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-full: 9999px;

  /* Transitions */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast: 120ms;
  --dur-base: 200ms;

  /* Default Category Variable Anchor (Catalogue Amber-Ink) */
  --cat-accent: oklch(65% 0.17 65);
  --cat-accent-ink: oklch(98% 0.01 65);
  --cat-accent-subtle: oklch(65% 0.17 65 / 0.10);
  --cat-border: oklch(65% 0.17 65 / 0.35);
  --cat-badge-bg: oklch(65% 0.17 65 / 0.12);
  --cat-badge-text: oklch(36% 0.14 65);
  --cat-glow: oklch(65% 0.17 65 / 0.16);

  --header-height: 3.5rem;
}

/* Light Theme Variables */
:root, [data-theme="light"] {
  color-scheme: light;
  --bg: oklch(95% 0.008 75);
  --bg-subtle: oklch(92% 0.012 75);
  --surface: oklch(98% 0.004 75);
  --surface-raised: oklch(100% 0 0);
  --surface-hover: oklch(93% 0.01 75);
  --surface-alt: oklch(90% 0.012 75);

  --border: oklch(82% 0.012 75);
  --border-strong: oklch(65% 0.02 75);
  --border-light: oklch(88% 0.008 75);

  --text: oklch(20% 0.018 60);
  --text-muted: oklch(46% 0.018 60);
  --text-dim: oklch(58% 0.014 60);

  --shadow-sm: 0 1px 2px oklch(20% 0.02 60 / 0.05);
  --shadow-md: 0 4px 10px oklch(20% 0.02 60 / 0.08);
  --shadow-lg: 0 12px 24px -4px oklch(20% 0.02 60 / 0.10);

  --warn-bg: oklch(92% 0.08 75);
  --warn-text: oklch(38% 0.14 60);
  --warn-border: oklch(76% 0.12 75);

  --danger-bg: oklch(92% 0.08 25);
  --danger-text: oklch(40% 0.18 25);
  --danger-border: oklch(76% 0.12 25);

  --focus-ring: oklch(52% 0.18 65);

  --text-outline:
    -1px -1px 0 rgba(0,0,0,0.85),
     1px -1px 0 rgba(0,0,0,0.85),
    -1px  1px 0 rgba(0,0,0,0.85),
     1px  1px 0 rgba(0,0,0,0.85),
     0 1px 3px rgba(0,0,0,0.4);
}

/* Dark Theme Variables */
[data-theme="dark"],
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: oklch(14% 0.012 260);
    --bg-subtle: oklch(18% 0.014 260);
    --surface: oklch(20% 0.016 260);
    --surface-raised: oklch(25% 0.018 260);
    --surface-hover: oklch(28% 0.02 260);
    --surface-alt: oklch(17% 0.014 260);

    --border: oklch(32% 0.018 260);
    --border-strong: oklch(44% 0.022 260);
    --border-light: oklch(26% 0.015 260);

    --text: oklch(95% 0.006 75);
    --text-muted: oklch(74% 0.012 75);
    --text-dim: oklch(58% 0.01 75);

    --shadow-sm: 0 1px 2px oklch(5% 0.01 260 / 0.4);
    --shadow-md: 0 4px 12px oklch(5% 0.01 260 / 0.5);
    --shadow-lg: 0 12px 24px -4px oklch(5% 0.01 260 / 0.6);

    --warn-bg: oklch(26% 0.07 70);
    --warn-text: oklch(86% 0.12 75);
    --warn-border: oklch(44% 0.1 70);

    --danger-bg: oklch(26% 0.08 25);
    --danger-text: oklch(88% 0.14 25);
    --danger-border: oklch(46% 0.12 25);

    --focus-ring: oklch(74% 0.16 65);
    --cat-badge-text: oklch(88% 0.12 65);

    --text-outline:
      -1px -1px 0 rgba(0,0,0,0.9),
       1px -1px 0 rgba(0,0,0,0.9),
      -1px  1px 0 rgba(0,0,0,0.9),
       1px  1px 0 rgba(0,0,0,0.9),
       0 2px 4px rgba(0,0,0,0.7);
  }
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: oklch(14% 0.012 260);
  --bg-subtle: oklch(18% 0.014 260);
  --surface: oklch(20% 0.016 260);

}

/* Category Chromatic Signatures */
body[data-page="characters"] {
  --cat-accent: oklch(64% 0.18 245);
  --cat-accent-ink: oklch(98% 0.01 245);
  --cat-accent-subtle: oklch(64% 0.18 245 / 0.10);
  --cat-border: oklch(64% 0.18 245 / 0.35);
  --cat-badge-bg: oklch(64% 0.18 245 / 0.14);
  --cat-badge-text: oklch(40% 0.17 245);
  --focus-ring: oklch(64% 0.18 245);
}
[data-theme="dark"] body[data-page="characters"],
body[data-page="characters"]:not([data-theme="light"]) {
  --cat-badge-text: oklch(86% 0.14 245);
}

body[data-page="pets"] {
  --cat-accent: oklch(66% 0.16 145);

  --cat-badge-bg: oklch(66% 0.16 145 / 0.14);

}
[data-theme="dark"] body[data-page="pets"],
body[data-page="pets"]:not([data-theme="light"]) {

  --cat-badge-bg: oklch(67% 0.16 85 / 0.14);

[data-theme="dark"] body[data-page="materials"],

/* ==========================================================================
   Global Reset & Base
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  overflow-x: clip;
  min-height: 100vh;
}

body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(to right, var(--border-light) 1px, transparent 1px),
    linear-gradient(to bottom, var(--border-light) 1px, transparent 1px);
  background-size: 40px 40px;
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-display);
  font-size: 14px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

a {
  color: var(--cat-accent);
  text-decoration: none;
  text-underline-offset: 2px;
  font-weight: 500;
  transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
a:hover {
  text-decoration: underline;
}

button, input, select {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 1px;
}

/* ==========================================================================
   Navigation Archetype: N9 Edge-Aligned Technical Ledger
   ========================================================================== */
header {
  position: sticky;
  top: 0;
  z-index: 300;
  background: var(--surface);
  border-bottom: 2px solid var(--border-strong);
  box-shadow: var(--shadow-sm);
}

.bar {
  max-width: 1360px;
  margin: 0 auto;
  padding: 0 var(--space-md);
  height: var(--header-height);
  display: flex;
  align-items: center;
  gap: var(--space-md);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  color: var(--text);
  font-weight: 800;
  font-size: 0.95rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-family: var(--font-mono);
  padding: var(--space-2xs) var(--space-xs);
  border: 1px solid var(--border);
  background: var(--bg-subtle);
  border-radius: var(--radius-xs);
  white-space: nowrap;
}
.brand::before {
  content: "■";
  color: var(--cat-accent);
  font-size: 0.75rem;
}
.brand:hover {
  text-decoration: none;
  border-color: var(--cat-accent);
}

nav {
  display: flex;
  align-items: stretch;
  height: 100%;
  gap: 0;
  border-inline: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
nav::-webkit-scrollbar {
  display: none;
}

nav a {
  display: inline-flex;
  align-items: center;
  padding: 0 var(--space-sm);
  color: var(--text-muted);
  font-size: 0.82rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-family: var(--font-mono);
  white-space: nowrap;
  border-inline-end: 1px solid var(--border);
  border-top: 3px solid transparent;
  transition: color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
nav a:hover {
  color: var(--text);
  text-decoration: none;
  background: var(--surface-hover);
}
nav a[aria-current="page"] {
  color: var(--text);
  background: var(--bg-subtle);
  border-top-color: var(--cat-accent);
  font-weight: 700;
}

/* Controls Bar */
.controls {
  display: flex;
  align-items: center;
  gap: var(--space-2xs);
  margin-inline-start: auto;
  flex-shrink: 0;
}

.search-wrap {
  position: relative;
}

input[type="search"], select, button {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  height: 2rem;
  padding: 0 var(--space-xs);
  border-radius: var(--radius-xs);
  font-size: 0.82rem;
  font-family: var(--font-mono);
  transition: border-color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
}

input[type="search"] {
  width: 170px;
}
input[type="search"]:focus {
  border-color: var(--cat-accent);
  background: var(--surface-raised);
}

select {
  cursor: pointer;
  max-width: 130px;
}
select:focus {
  border-color: var(--cat-accent);
}

button {
  cursor: pointer;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  padding: 0 var(--space-sm);
}
button:hover:not(:disabled) {
  background: var(--surface-hover);
  border-color: var(--border-strong);
}
button:active:not(:disabled) {
  background: var(--bg-subtle);
  transform: translateY(1px);
}
button:disabled {
  cursor: wait;
  opacity: 0.55;
}

.theme-btn {
  padding: 0 var(--space-2xs);
  width: 2rem;
}

/* ==========================================================================
   Main & Layout Containers
   ========================================================================== */
main {
  max-width: 1360px;
  width: 100%;
  margin: 0 auto;
  padding: var(--space-lg) var(--space-md);
  flex: 1;
  min-width: 0;
}

/* Catalogue Inventory Headings */
.page-header {
  margin-bottom: var(--space-lg);
  padding: var(--space-sm) var(--space-md);
  background: var(--surface);
  border: 1px solid var(--border);
  border-inline-start: 4px solid var(--cat-accent);
  border-radius: var(--radius-xs);
}

h1 {
  font-size: 1.4rem;
  font-weight: 800;
  letter-spacing: -0.015em;
  margin: 0;
  color: var(--text);
  overflow-wrap: anywhere;
  min-width: 0;
  font-style: normal;
  line-height: 1.2;
}

h2 {
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  margin: var(--space-lg) 0 var(--space-xs);
  color: var(--text);
  font-style: normal;
  display: flex;
  align-items: center;
  gap: var(--space-xs);
}
h2::before {
  content: "//";
  color: var(--cat-accent);
  font-family: var(--font-mono);
}

h3 {
  margin: 0;
  font-size: 0.92rem;
  font-weight: 600;
  font-style: normal;
}

.muted {
  color: var(--text-muted);
  margin: var(--space-3xs) 0 0;
  font-size: 0.85rem;
}

.key {
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 0.74rem;
  overflow-wrap: anywhere;
  letter-spacing: -0.01em;
}

/* Section Header Bar */
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-md);
  margin-bottom: var(--space-md);
  padding-bottom: var(--space-2xs);
  border-bottom: 1px solid var(--border-strong);
}
.section-head h1 {
  font-size: 1.25rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.section-head .muted {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 600;
}

/* ==========================================================================
   Catalogue Grid & Inventory Cards
   ========================================================================== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  overflow: hidden;
}

/* Hub Category Cards */
.hub-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
  gap: var(--space-md);
  margin: var(--space-md) 0 var(--space-xl);
}

.hub-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: var(--space-md);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  background: var(--surface);
  text-decoration: none;
  color: var(--text);
  position: relative;
  transition: border-color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
}
.hub-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: var(--card-accent, var(--cat-accent));
}
.hub-card:hover {
  text-decoration: none;
  border-color: var(--card-accent, var(--cat-accent));
  background: var(--surface-raised);
}
.hub-card .count {
  font-family: var(--font-mono);
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: -0.04em;
  color: var(--card-accent, var(--cat-accent));
  line-height: 1;
  margin-bottom: var(--space-xs);
  font-variant-numeric: tabular-nums;
}
.hub-card h2 {
  margin: 0;
  font-size: 0.95rem;
}
.hub-card h2::before {
  display: none;
}

/* Standard Specimen Card */
.card {
  display: block;
  min-width: 0;
  padding: var(--space-sm) var(--space-md);
  background: var(--surface);
  text-decoration: none;
  color: var(--text);
  transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
a.card:hover {
  text-decoration: none;
  background: var(--surface-hover);
}
a.card:active {
  background: var(--bg-subtle);
}

.card.card-thumb {
  display: flex;
  gap: var(--space-sm);
  align-items: center;
}
.card-info {
  min-width: 0;
  flex: 1;
}
.card p {
  margin: var(--space-3xs) 0 0;
}

/* Fusion Recipes */
.fusion-recipe {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-xs);
  padding: var(--space-xs) var(--space-sm);
  background: var(--surface);
  font-size: 0.88rem;
  font-family: var(--font-mono);
}
.fusion-sources {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-3xs);
}
.fusion-range-block {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-3xs);
  padding: 0.1rem 0.35rem;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
}
.fusion-range-label {
  color: var(--text-muted);
  font-size: 0.78rem;
}
.fusion-range-sep {
  color: var(--text-dim);
  font-size: 0.78rem;
}
.fusion-op {
  color: var(--text-muted);
  font-weight: 700;
  margin: 0 0.1rem;
}
.fusion-arrow {
  color: var(--cat-accent);
  font-weight: 800;
  margin: 0 var(--space-xs);
}

/* Character Card Selection Grid */
.char-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(190px, 100%), 1fr));
  gap: var(--space-sm);
}

.char-select-card {
  position: relative;
  aspect-ratio: 5 / 7;
  border-radius: var(--radius-xs);
  border: 1px solid var(--border);
  background: var(--surface);
  overflow: hidden;
  text-decoration: none;
  color: var(--text);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: var(--space-sm);
  box-shadow: var(--shadow-sm);
  transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
a.char-select-card:hover {
  text-decoration: none;
  border-color: var(--cat-accent);
  transform: translateY(-2px);
}

.char-card-bg {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

.char-card-header {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  border-bottom: 1px solid var(--border-light);
  margin: calc(-1 * var(--space-sm)) calc(-1 * var(--space-sm)) 0;
  padding: var(--space-xs) var(--space-sm);
}

.char-card-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
}

.char-card-footer {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  border-top: 1px solid var(--border-light);
  margin: 0 calc(-1 * var(--space-sm)) calc(-1 * var(--space-sm));
  padding: var(--space-xs) var(--space-sm);
  font-size: 0.74rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
}

.char-card-id {
  font-weight: 700;
  color: var(--cat-accent);
}
.char-card-code {
  color: var(--text-dim);
}

/* Character Drawing Transitions */
.char-drawing {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.char-drawing-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  transform: scale(1.6);
  opacity: 0;
  transition: opacity 0.2s ease-in-out;
  pointer-events: none;
}
.char-drawing-img.is-active {
  opacity: 1;
}
.char-card-bg .char-drawing-img {
  padding: var(--space-md) var(--space-2xs);
}
.char-drawing-img.is-fallback {
  transform: scale(1);
  image-rendering: pixelated;
  width: auto;
  height: auto;
  max-width: 60%;
  max-height: 60%;
  margin: auto;
}

/* Character Detail Dossier */
.character-hero-header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 260px;
  gap: var(--space-lg);
  align-items: start;
  padding: var(--space-md);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  margin-bottom: var(--space-lg);
}

.character-hero-info {
  min-width: 0;
}

.character-hero-drawing {
  width: 100%;
  aspect-ratio: 1 / 1;
  max-height: 260px;
  background: var(--surface-alt);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-xs);
  overflow: hidden;
  position: relative;
}
.character-hero-drawing .char-drawing-img {
  padding: var(--space-xs);
}
.character-hero-drawing .char-drawing-img:not(.is-fallback) {
  transform: scale(1.15);
}

.sprite-preview {
  image-rendering: pixelated;
  object-fit: contain;
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  padding: 2px;
}

/* ==========================================================================
   Badges, Fields, and Tables (Tabular Ledger Data)
   ========================================================================== */
.badge {
  display: inline-flex;
  align-items: center;
  margin: 0.1rem 0.2rem 0.1rem 0;
  padding: 0.08rem 0.4rem;
  border-radius: var(--radius-xs);
  background: var(--cat-badge-bg);
  color: var(--cat-badge-text);
  font-size: 0.72rem;
  font-weight: 700;
  font-family: var(--font-mono);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  line-height: 1.3;
}
.badge.warn {
  background: var(--warn-bg);
  color: var(--warn-text);
  border: 1px solid var(--warn-border);
}
.badge.error {
  background: var(--danger-bg);
  color: var(--danger-text);
  border: 1px solid var(--danger-border);
}

.stack {
  display: grid;
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  overflow: hidden;
}

.field {
  padding: var(--space-xs) var(--space-sm);
  background: var(--surface);
}
.field dt {
  color: var(--text-muted);
  font-size: 0.74rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-family: var(--font-mono);
  margin-bottom: var(--space-3xs);
}
.field dd {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--text);
  font-size: 0.88rem;
}

/* Callouts & Status */
.status {
  margin: var(--space-sm) 0 var(--space-md);
  padding: var(--space-sm) var(--space-md);
  border: 1px solid var(--border);
  border-inline-start: 3px solid var(--cat-accent);
  background: var(--surface);
  border-radius: var(--radius-xs);
  font-size: 0.85rem;
}
.status.warn {
  border-inline-start-color: var(--warn-text);
  background: color-mix(in srgb, var(--warn-bg) 25%, var(--surface));
}
.status.error {
  border-inline-start-color: var(--danger-text);
  background: color-mix(in srgb, var(--danger-bg) 25%, var(--surface));
}

.empty {
  padding: var(--space-xl) var(--space-md);
  text-align: center;
  color: var(--text-muted);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-xs);
  background: var(--bg-subtle);
  font-size: 0.88rem;
  font-family: var(--font-mono);
}

/* ==========================================================================
   Footer Archetype: Ft4 Dense Archival Colophon
   ========================================================================== */
footer {
  width: 100%;
  margin-top: auto;
  border-top: 2px solid var(--border-strong);
  background: var(--surface);
  font-family: var(--font-mono);
  font-size: 0.76rem;
  color: var(--text-muted);
}
.footer-inner {
  max-width: 1360px;
  margin: 0 auto;
  padding: var(--space-md);
}
footer .status {
  margin: 0;
  padding: var(--space-2xs) var(--space-xs);
  border: none;
  background: transparent;
  font-size: 0.76rem;
}
footer #source {
  margin-top: var(--space-2xs);
  color: var(--text-dim);
}

[hidden] {
  display: none !important;
}

/* ==========================================================================
   Responsive Adaptations
   ========================================================================== */
@media (max-width: 860px) {
  header {
    height: auto;
    padding-bottom: var(--space-xs);
  }

    height: auto;

@media (max-width: 480px) {

  }

    animation-duration: 0.01ms !important;

function t(key, ...args) {
  const row = I18N_STATIC[key];
  if (!row) return key;
  const idx = languageIndex(state.language);
  let text = row[idx] || row[0] || key;
  for (let i = 0; i < args.length; i++) text = text.replaceAll(`{${i}}`, String(args[i]));
  return text;
}

function updateNav() {
  const pages = [['home','home'],['characters','characters'],['pets','pets'],['weapons','weapons'],['materials','materials'],['seeds','seeds'],['blueprints','blueprints'],['enemies','enemies']];
  for (const [page, key] of pages) {
    const link = document.querySelector(`nav a[data-page="${page}"]`);
    if (link) link.textContent = t(key);
  }

}

function applyTheme(theme) {
  state.theme = theme;
  if (theme === 'auto') {
    document.documentElement.removeAttribute('data-theme');
    themeToggle.textContent = '◐';
  } else {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '☾' : '☼';
  }
  try { localStorage.setItem('skdfe-theme', theme); } catch {}
}

function cycleTheme() {
  const next = state.theme === 'auto' ? 'dark' : state.theme === 'dark' ? 'light' : 'auto';
  applyTheme(next);
}

function el(tag, attrs={}, ...children) {
  const node = document.createElement(tag);
  for (const [key,value] of Object.entries(attrs)) {
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key === 'hidden') node.hidden = value;
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) if (child != null) node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  return node;
}

function setStatus(message, kind='') {
  state.message = message;

  statusBox.textContent = message;
  statusBox.className = `status${kind ? ` ${kind}` : ''}`;
}

function parseCSV(text) {
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
  const rows=[];
  let row=[], field='', quoted=false, closed=false;
  for (let i=0; i<text.length; i++) {
    const ch=text[i];
    if (quoted) {
      if (ch === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else { quoted=false; closed=true; }
      } else field += ch;
      continue;
    }
    if (closed) {
      if (ch === ',') { row.push(field); field=''; closed=false; }
      else if (ch === '\r' || ch === '\n') { row.push(field); rows.push(row); row=[]; field=''; closed=false; if (ch === '\r' && text[i+1] === '\n') i++; }
      else throw new Error(`Unexpected character after closing quote at offset ${i}`);
    } else if (ch === '"') {
      if (field) throw new Error(`Unexpected quote at offset ${i}`);
      quoted=true;
    } else if (ch === ',') { row.push(field); field=''; }
    else if (ch === '\r' || ch === '\n') { row.push(field); rows.push(row); row=[]; field=''; if (ch === '\r' && text[i+1] === '\n') i++; }
    else field += ch;
  }
  if (quoted) throw new Error('Unclosed quoted CSV field');
  if (closed || field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function parseLocalization(text) {
  const rows = parseCSV(text);
  const expected = ['id', ...LANGUAGES];
  if (!rows.length || rows[0].length !== expected.length || rows[0].some((value,index) => value !== expected[index])) throw new Error('Unexpected localization CSV header');
  if (rows.length < 1000) throw new Error(`Localization CSV too small: ${rows.length - 1} records`);
  const entries = new Map();
  for (let i=1; i<rows.length; i++) {
    const row=rows[i];
    if (row.length !== expected.length) throw new Error(`Localization row ${i+1} has ${row.length} fields`);
    const id=row[0].trim();
    if (!id) throw new Error(`Localization row ${i+1} has an empty ID`);
    if (entries.has(id)) throw new Error(`Duplicate localization ID: ${id}`);
    entries.set(id,row.slice(1));
  }
  for (const key of ['Character0_name_skin0','Pet_name_0','weapon/weapon_000']) if (!entries.has(key)) throw new Error(`Missing localization sentinel: ${key}`);
  return entries;
}

function enemyType(key,isBoss) { return isBoss?'Boss':key.startsWith('ex_')?'Elite':'Normal'; }

function parseEnemyDrop(value,name) {
  assertObject(value,name); assertObject(value.item,`${name}.item`);
  if (typeof value.item.item!=='string' || !value.item.item) throw new Error(`${name} has an invalid item ID`);
  if (typeof value.probability!=='number' || !Number.isFinite(value.probability) || value.probability<0) throw new Error(`${name} has an invalid probability`);
  if (typeof value.guaranteeDrop!=='boolean') throw new Error(`${name} has an invalid guaranteeDrop`);
  if (!Number.isSafeInteger(value.guaranteeDropCount) || value.guaranteeDropCount<0) throw new Error(`${name} has an invalid guaranteeDropCount`);
  if (!Array.isArray(value.conditions)) throw new Error(`${name} has invalid conditions`);
  value.conditions.forEach((condition,index)=>assertObject(condition,`${name}.conditions[${index}]`));
  return {item:value.item.item,probability:value.probability,guaranteeDrop:value.guaranteeDrop,guaranteeDropCount:value.guaranteeDropCount,conditions:value.conditions};
}

function parseEnemyCSV(text) {
  const rows=parseCSV(text);
  if (rows.length<3 || rows[0]?.length!==ENEMY_HEADER.length || ENEMY_HEADER.some((value,index)=>rows[0][index]!==value)) throw new Error('Unexpected enemies CSV header');
  if (rows[1]?.length!==ENEMY_SCHEMA.length || ENEMY_SCHEMA.some((value,index)=>rows[1][index]!==value)) throw new Error('Unexpected enemies CSV schema row');
  const enemies=new Map();
  for (let index=2; index<rows.length; index++) {
    const row=rows[index];
    if (row.length!==ENEMY_HEADER.length) throw new Error(`Enemies CSV row ${index+1} has ${row.length} fields`);
    const key=row[0].trim(), enemyId=row[4].trim(), isBossText=row[12], bossWeapon=row[16].trim(), subspeciesBoss=row[17].trim();
    if (!key) throw new Error(`Enemies CSV row ${index+1} has an empty Key`);
    if (enemies.has(key)) throw new Error(`Duplicate enemy Key: ${key}`);
    if (isBossText!=='True' && isBossText!=='False') throw new Error(`Enemy ${key} has an invalid IsBoss`);
    const drops=parseJSON(row[21],`Enemy ${key} Drops`), groups=parseJSON(row[22],`Enemy ${key} DropGroups`);
    if (!Array.isArray(drops) || !Array.isArray(groups)) throw new Error(`Enemy ${key} has invalid drops`);
    const parsedDrops=drops.map((drop,dropIndex)=>parseEnemyDrop(drop,`Enemy ${key} Drops[${dropIndex}]`));
    const dropGroups=groups.map((group,groupIndex)=>{
      const name=`Enemy ${key} DropGroups[${groupIndex}]`; assertObject(group,name);
      if (typeof group.probability!=='number' || !Number.isFinite(group.probability) || group.probability<0) throw new Error(`${name} has an invalid probability`);
      if (typeof group.randomOrder!=='boolean' || !Array.isArray(group.Drops)) throw new Error(`${name} is invalid`);
      return {probability:group.probability,randomOrder:group.randomOrder,drops:group.Drops.map((drop,dropIndex)=>parseEnemyDrop(drop,`${name}.Drops[${dropIndex}]`))};
    });
    const isBoss=isBossText==='True';
    enemies.set(key,{type:'enemies',key,enemyId,isBoss,enemyType:enemyType(key,isBoss),bossWeapon,subspeciesBoss,drops:parsedDrops,dropGroups});
  }
  return enemies;
}

function parseItemsCSV(text) {
  const rows=parseCSV(text);
  const header=['Key','Type','SubType','DataStr'];
  const schema=['string','string','string','string'];
  if (rows.length<3 || header.some((value,index)=>rows[0]?.[index]!==value) || rows[0].length!==4) throw new Error('Unexpected items CSV header');
  if (schema.some((value,index)=>rows[1]?.[index]!==value) || rows[1].length!==4) throw new Error('Unexpected items CSV schema row');
  const keys=new Set(), blueprints=new Map(), seeds=new Map(), materialLevels=new Map();
  for (let index=2; index<rows.length; index++) {
    const row=rows[index];
    if (row.length!==4) throw new Error(`Items CSV row ${index+1} has ${row.length} fields`);
    const [key,type,subType,dataText]=row;
    if (!key.trim()) throw new Error(`Items CSV row ${index+1} has an empty Key`);
    if (keys.has(key)) throw new Error(`Duplicate item Key: ${key}`);
    keys.add(key);
    if (type==='BluePrint' && subType==='Blueprint') {
      const data=parseJSON(dataText,`items CSV ${key}`);
      assertObject(data,`items CSV ${key} DataStr`);
      if (data.Name!==key) throw new Error(`Blueprint ${key} Name does not match Key`);
      if (typeof data.ItemName!=='string' || !data.ItemName) throw new Error(`Blueprint ${key} has an invalid ItemName`);
      if (!Number.isInteger(data.BlueprintType)) throw new Error(`Blueprint ${key} has an invalid BlueprintType`);
      for (const field of ['Hero','SkinIndex','SkillIndex']) if (!Number.isSafeInteger(data[field]) || data[field]<0) throw new Error(`Blueprint ${key} has an invalid ${field}`);
      if (typeof data.Localization!=='string') throw new Error(`Blueprint ${key} has an invalid Localization`);
      if (!Array.isArray(data.ResearchMaterials)) throw new Error(`Blueprint ${key} has invalid ResearchMaterials`);
      const seenMaterials=new Set();
      const materials=data.ResearchMaterials.map((entry,materialIndex)=>{
        assertObject(entry,`Blueprint ${key} ResearchMaterials[${materialIndex}]`);
        if (typeof entry.item!=='string' || !entry.item) throw new Error(`Blueprint ${key} has an invalid research material ID`);
        if (!Number.isSafeInteger(entry.num) || entry.num<=0) throw new Error(`Blueprint ${key} has an invalid research quantity`);
        if (seenMaterials.has(entry.item)) throw new Error(`Blueprint ${key} repeats research material ${entry.item}`);
        seenMaterials.add(entry.item);
        return {item:entry.item,num:entry.num};
      });
      blueprints.set(key,{itemId:data.ItemName,blueprintType:data.BlueprintType,hero:data.Hero,skinIndex:data.SkinIndex,skillIndex:data.SkillIndex,localization:data.Localization,materials});
    } else if (type==='Seed') {
      const data=parseJSON(dataText,`items CSV ${key}`);
      assertObject(data,`items CSV ${key} DataStr`);
      const level=Number.isInteger(data.ItemLevel)?data.ItemLevel:0;
      const value=Number.isInteger(data.ItemValue)?data.ItemValue:0;
      const localizationKey=key.replace(/_seed$/,'');
      seeds.set(key,{type:'seeds',id:key,level,value,localizationKey});
    } else if (type==='Material') {
      const data=parseJSON(dataText,`items CSV ${key}`);
      if (data && Number.isInteger(data.ItemLevel)) {
        materialLevels.set(key, data.ItemLevel);
      }
    }
  }
  return {blueprints, seeds, materialLevels};
}

function parseBlueprintCSV(text) {
  return parseItemsCSV(text).blueprints;
}

function seedName(seed, language=state.language) {
  const value=localized(seed.localizationKey,{language,englishFallback:seed.id});
  return value.text==='Not localized'?{text:seed.id,status:'unresolved',key:seed.localizationKey}:value;
}

function blueprintLocalizationKey(id,row) {
  switch (row.blueprintType) {
    case 0: case 1: return row.itemId.replace(/_skin_(\d+)$/,'_skin_name_$1');
    case 2: return row.itemId;
    case 3: return row.localization;
    case 4: return `Character${row.hero}_skill_${row.skillIndex}_name`;
    case 5: return `Character${row.hero}_name_skin${row.skinIndex}`;
    case 6: case 7: return `weapon/${row.itemId}`;
    case 8: {
      const target=id.replace(/^blueprint_evolution_/,'');
      if (target===id) throw new Error(`Evolution blueprint ${id} has an invalid ID`);
      return `weapon/${target}`;
    }
    default: throw new Error(`Blueprint ${id} has unsupported type ${row.blueprintType}`);
  }
}

function parseJSON(raw, name) {
  try { return JSON.parse(raw); }
  catch (error) { throw new Error(`${name}: ${error.message}`); }
}

function assertObject(value, name) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error(`${name} must be an object`);
}

function characterWeaponIds(code) {
  const starting=code==='Knight'?'weapon_000':`weapon_init_${code.toLowerCase()}`;
  return {starting,upgraded:`${starting}x`};
}

function parseWeaponsCSV(text) {
  const rows=parseCSV(text);
  if (rows.length<3 || rows[0]?.[0]!=='Key' || rows[0]?.[2]!=='OriginalWeapon' || rows[0]?.[9]!=='Materials' || rows[0]?.[10]!=='FusionList' || rows[0]?.[11]!=='FusionRangeList') {
    throw new Error('Unexpected weapons CSV header');
  }
  const weaponsData=new Map();
  for (let index=2; index<rows.length; index++) {
    const row=rows[index];
    if (!row || row.length<11) continue;
    const key=row[0].trim();
    if (!key) continue;
    const originalWeapon=row[2]?.trim() || null;
    let materials=[];
    if (row[9]?.trim() && row[9].trim()!=='[]') {
      materials=parseJSON(row[9], `Weapon ${key} Materials`);
    }
    let fusionList=[];
    if (row[10]?.trim() && row[10].trim()!=='[]') {
      fusionList=parseJSON(row[10], `Weapon ${key} FusionList`);
    }
    let fusionRangeList=[];
    if (row[11]?.trim() && row[11].trim()!=='[]') {
      fusionRangeList=parseJSON(row[11], `Weapon ${key} FusionRangeList`);
    }
    weaponsData.set(key, {originalWeapon, materials, fusionList, fusionRangeList});
  }
  return weaponsData;
}

function weaponLink(code) {
  const w=state.model?.weapons.find(value=>value.code===code);
  const name=w?weaponName(w):{text:code};
  const style=w?weaponRarityStyle(w.level):'';
  const attrs={href:routeFor('weapons',code),text:name.text};
  if (style) attrs.style=`${style};font-weight:600;`;
  return el('a',attrs);
}

function renderFusionRecipe(recipe) {
  const item=el('div',{class:'card fusion-recipe'});
  const sourcesEl=el('span',{class:'fusion-sources'});
  let hasPrefix=false;
  if (recipe.sources && recipe.sources.length) {
    recipe.sources.forEach((srcCode,i)=>{
      if (i>0) sourcesEl.append(el('span',{class:'fusion-op',text:'+'}));
      sourcesEl.append(weaponLink(srcCode));
    });
    hasPrefix=true;
  }
  if (recipe.range && recipe.range.length) {
    if (hasPrefix) sourcesEl.append(el('span',{class:'fusion-op',text:'+'}));
    const rangeBlock=el('span',{class:'fusion-range-block'});
    rangeBlock.append(el('span',{class:'fusion-range-label',text:t('any_n_of',recipe.inRangeCount||1)+' ['}));
    recipe.range.forEach((rngCode,i)=>{
      if (i>0) rangeBlock.append(el('span',{class:'fusion-range-sep',text:' / '}));
      rangeBlock.append(weaponLink(rngCode));
    });
    rangeBlock.append(el('span',{class:'fusion-range-label',text:']'}));
    sourcesEl.append(rangeBlock);
  }
  const arrowEl=el('span',{class:'fusion-arrow',text:'→'});
  const targetEl=weaponLink(recipe.target);
  item.append(sourcesEl,arrowEl,targetEl);
  return item;
}

function parseWeapons(value) {
  assertObject(value,'weapon_full.json');
  if (!Array.isArray(value.weapons)) throw new Error('weapon_full.json.weapons must be an array');
  const ids=new Set();
  return value.weapons.map((weapon,index)=>{
    const source=`weapon_full.json.weapons[${index}]`;
    assertObject(weapon,source);
    if (typeof weapon.name!=='string' || !weapon.name) throw new Error(`${source} has an invalid name`);
    if (!Number.isSafeInteger(weapon.level) || weapon.level<0) throw new Error(`${source} has an invalid level`);
    if (typeof weapon.type!=='string' || !weapon.type) throw new Error(`${source} has an invalid type`);
    if (ids.has(weapon.name)) throw new Error(`Duplicate weapon name: ${weapon.name}`);
    ids.add(weapon.name);
    return {code:weapon.name,english:typeof weapon.title==='string'?weapon.title:'',level:weapon.level,weaponType:weapon.type};
  });
}

function buildModel(snapshot) {
  const raw=snapshot.files;
  if (!raw || FILES.some(name => typeof raw[name] !== 'string')) throw new Error('Snapshot files are incomplete');
  const version=parseJSON(raw['version.json'],'version.json');
  const charCodes=parseJSON(raw['char_code_name.json'],'char_code_name.json');
  const petCodes=parseJSON(raw['pet_code_name.json'],'pet_code_name.json');
  const weapons=parseWeapons(parseJSON(raw['weapon_full.json'],'weapon_full.json'));
  const weaponSkins=parseJSON(raw['weapon_skins.json'],'weapon_skins.json');
  const items=parseJSON(raw['item.json'],'item.json');
  if (!version || typeof version.version !== 'string') throw new Error('version.json lacks version string');
  if (!Array.isArray(charCodes) || charCodes.some(v => typeof v !== 'string')) throw new Error('char_code_name.json must be a string array');
  if (!Array.isArray(petCodes) || petCodes.some(v => typeof v !== 'string')) throw new Error('pet_code_name.json must be a string array');
  assertObject(weaponSkins,'weapon_skins.json'); assertObject(weaponSkins.weapons,'weapon_skins.json.weapons'); assertObject(items,'item.json'); assertObject(items.material,'item.json.material'); assertObject(items.blueprint,'item.json.blueprint');
  if (!/^[0-9a-f]{40}$/.test(snapshot.sha) && !/^[a-zA-Z0-9_./-]+$/.test(snapshot.sha)) throw new Error('Snapshot ref/SHA is invalid');
  const i18n=parseLocalization(raw['I2language.csv']);
  const keys=[...i18n.keys()];

  const skinIds=new Map(), skillIds=new Map(), petSkillIds=new Map();
  for (const key of keys) {
    let match=key.match(/^Character(\d+)_name_skin(\d+)$/);
    if (match) { const id=Number(match[1]); if (!skinIds.has(id)) skinIds.set(id,new Set()); skinIds.get(id).add(Number(match[2])); continue; }
    match=key.match(/^Character(\d+)_skill_(\d+)_(name|info|x)$/);
    if (match) { const id=Number(match[1]); if (!skillIds.has(id)) skillIds.set(id,new Set()); skillIds.get(id).add(Number(match[2])); continue; }
    match=key.match(/^pet_(\d+)_skill_(\d+)_(name|desc)$/);
    if (match) { const id=Number(match[1]); if (!petSkillIds.has(id)) petSkillIds.set(id,new Set()); petSkillIds.get(id).add(Number(match[2])); }
  }

  const characters=charCodes.map((code,id) => ({type:'characters',id,code,...characterWeaponIds(code),skinIds:[...(skinIds.get(id)||[])].sort((a,b)=>a-b),skillIds:[...(skillIds.get(id)||[])].sort((a,b)=>a-b)}));
  const pets=petCodes.map((code,id) => ({type:'pets',id,code,skillIds:[...(petSkillIds.get(id)||[])].sort((a,b)=>a-b)}));
  const evolutionIds=new Set(Array.isArray(items.blueprint?.evolution) ? items.blueprint.evolution.map(id => id.replace(/^blueprint_evolution_/,'')) : []);

  const weaponsCSV=typeof raw[WEAPONS_CSV_FILE]==='string'?parseWeaponsCSV(raw[WEAPONS_CSV_FILE]):null;
  const targetFusions=new Map(), sourceFusions=new Map();
  if (weaponsCSV) {
    const seenRecipes=new Set();
    for (const [,wData] of weaponsCSV) {
      for (const item of (wData.fusionList||[])) {
        const sources=(item.sourceWeapons||[]).map(s=>s.weapon).filter(Boolean);
        const target=item.targetWeapon?.weapon;
        if (!target || !sources.length) continue;
        const key=`${[...sources].sort().join('+')}=>${target}`;
        if (seenRecipes.has(key)) continue;
        seenRecipes.add(key);
        const recipe={sources,target};
        if (!targetFusions.has(target)) targetFusions.set(target,[]);
        targetFusions.get(target).push(recipe);
        for (const src of new Set(sources)) {
          if (!sourceFusions.has(src)) sourceFusions.set(src,[]);
          sourceFusions.get(src).push(recipe);
        }
      }
      for (const item of (wData.fusionRangeList||[])) {
        const sources=(item.sourceWeapons||[]).map(s=>s.weapon).filter(Boolean);
        const range=(item.sourceWeaponsRange||[]).map(s=>s.weapon).filter(Boolean);
        const inRangeCount=Number(item.inRangeCount)||1;
        const target=item.targetWeapon?.weapon;
        if (!target || (!sources.length && !range.length)) continue;
        const key=`${[...sources].sort().join('+')}+any(${inRangeCount},${[...range].sort().join('/')})=>${target}`;
        if (seenRecipes.has(key)) continue;
        seenRecipes.add(key);
        const recipe={sources,range,inRangeCount,target};
        if (!targetFusions.has(target)) targetFusions.set(target,[]);
        targetFusions.get(target).push(recipe);
        for (const src of new Set([...sources, ...range])) {
          if (!sourceFusions.has(src)) sourceFusions.set(src,[]);
          sourceFusions.get(src).push(recipe);
        }
      }
    }
  }

  const weaponEntities=weapons.map(weapon => {
    const csvData=weaponsCSV?.get(weapon.code);
    const originalWeapon=csvData?.originalWeapon || null;
    const materials=csvData?.materials || [];
    const targetRecipes=targetFusions.get(weapon.code) || [];
    const sourceRecipes=sourceFusions.get(weapon.code) || [];
    return {
      type:'weapons',
      ...weapon,
      skinIds:[...new Set(weaponSkins.weapons[weapon.code]?.UnlockedSkins || [])].sort(naturalCompare),
      hasEvolution:evolutionIds.has(weapon.code)||i18n.has(`desc_evolution_${weapon.code}`),
      originalWeapon,
      materials,
      targetFusions:targetRecipes,
      sourceFusions:sourceRecipes,
      subWeapons:[]
    };
  }).sort((a,b)=>naturalCompare(a.code,b.code));

  const weaponsByCode=new Map(weaponEntities.map(weapon=>[weapon.code,weapon]));
  for (const weapon of weaponEntities) if (weapon.originalWeapon) weaponsByCode.get(weapon.originalWeapon)?.subWeapons.push(weapon);
  for (const weapon of weaponEntities) weapon.subWeapons.sort((a,b)=>naturalCompare(a.code,b.code));
  const weaponIds=new Set(weaponEntities.map(weapon=>weapon.code));
  for (const character of characters) for (const id of [character.starting,character.upgraded]) {
    if (!weaponIds.has(id) || !i18n.has(`weapon/${id}`)) throw new Error(`Character ${character.code} starting weapon is missing: ${id}`);
  }
  const itemsParsed=typeof raw[BLUEPRINT_FILE]==='string'?parseItemsCSV(raw[BLUEPRINT_FILE]):null;
  const materialLevels=itemsParsed?.materialLevels;
  const materials=[], materialIds=new Set();
  for (const [group,values] of Object.entries(items.material)) {
    if (!Array.isArray(values)) throw new Error(`item.json material.${group} must be an array`);
    for (const id of values) {
      if (typeof id!=='string' || !id) throw new Error(`item.json material.${group} contains an invalid ID`);
      if (materialIds.has(id)) throw new Error(`Duplicate material ID: ${id}`);
      materialIds.add(id);
      const level=materialLevels?.get(id) ?? 0;
      materials.push({type:'materials',id,group,level});
    }
  }
  materials.sort((a,b)=>naturalCompare(a.id,b.id));

  const blueprintIndex=[], blueprintIds=new Set();
  for (const [group,values] of Object.entries(items.blueprint)) {
    if (!Array.isArray(values)) throw new Error(`item.json blueprint.${group} must be an array`);
    for (const id of values) {
      if (typeof id!=='string' || !id) throw new Error(`item.json blueprint.${group} contains an invalid ID`);
      if (blueprintIds.has(id)) throw new Error(`Duplicate blueprint ID: ${id}`);
      blueprintIds.add(id); blueprintIndex.push({id,group});
    }
  }
  let blueprints=null;
  if (itemsParsed?.blueprints) {
    const blueprintRows=itemsParsed.blueprints;
    if (blueprintRows.size!==blueprintIds.size || [...blueprintIds].some(id=>!blueprintRows.has(id)) || [...blueprintRows.keys()].some(id=>!blueprintIds.has(id))) throw new Error('Blueprint IDs differ between item.json and items.decrypted.csv');
    blueprints=blueprintIndex.map(({id,group})=>{
      const row=blueprintRows.get(id), localizationKey=blueprintLocalizationKey(id,row);
      if (!localizationKey || !i18n.has(localizationKey)) throw new Error(`Blueprint ${id} localization key is missing: ${localizationKey}`);
      for (const cost of row.materials) if (!materialIds.has(cost.item)) throw new Error(`Blueprint ${id} references unknown material ${cost.item}`);
      return {type:'blueprints',id,group,itemId:row.itemId,blueprintType:row.blueprintType,localizationKey,materials:row.materials};
    }).sort((a,b)=>naturalCompare(a.id,b.id));
  }
  const seeds=itemsParsed?[...itemsParsed.seeds.values()].sort((a,b)=>naturalCompare(a.id,b.id)):null;
  const enemyRows=typeof raw[ENEMY_FILE]==='string'?parseEnemyCSV(raw[ENEMY_FILE]):null;
  const enemies=enemyRows?[...enemyRows.values()].sort((a,b)=>naturalCompare(a.key,b.key)):null;
  return {version:version.version,i18n,charCodes,characters,pets,weapons:weaponEntities,weaponList:weaponEntities.filter(weapon=>!weapon.originalWeapon),materials,seeds,blueprints,blueprintCount:blueprintIds.size,enemies};
}

function naturalCompare(a,b) { return String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'}); }
function languageIndex(language=state.language) { return Math.max(0,LANGUAGES.indexOf(language)); }

function localized(key, options={}) {
  const {englishFallback='', language=state.language, visited=new Set()}=options;
  const row=state.model?.i18n.get(key);
  if (!row) return englishFallback ? {text:englishFallback,status:'English fallback',key} : {text:'Not localized',status:'missing',key};
  const index=languageIndex(language);
  let value=(row[index] ?? '').trim();
  if (!value && index !== 0 && row[0]?.trim()) return resolveAlias(key,row[0].trim(),0,new Set(),{text:row[0].trim(),status:'English fallback',key});
  if (!value && englishFallback) return {text:englishFallback,status:index===0?'JSON fallback':'English fallback',key};
  if (!value) return {text:'Not localized',status:'missing',key};
  return resolveAlias(key,value,index,visited,{text:value,status:'exact',key});
}

function resolveAlias(key,value,index,visited,fallback) {
  const match=value.match(/^\{([A-Za-z][A-Za-z0-9_./-]*)\}$/);
  if (!match) return fallback;
  if (visited.has(key) || visited.size >= 24) return {text:value,status:'alias cycle',key};
  const target=match[1], row=state.model?.i18n.get(target);
  if (!row) return {text:value,status:'unresolved alias',key};
  visited.add(key);
  let next=(row[index] ?? '').trim();
  let status='alias';
  if (!next && index !== 0) { next=(row[0] ?? '').trim(); status='English fallback'; }
  if (!next) return {text:value,status:'unresolved alias',key};
  const resolved=resolveAlias(target,next,index,visited,{text:next,status,key});
  return {...resolved,key,status:resolved.status==='exact'?status:resolved.status};
}

function formatTemplate(template,value) {
  if (template.includes('{}')) return template.replace('{}',value);
  if (template.includes('{0}')) return template.replace('{0}',value);
  return '';
}

function inferMaterial(material, language=state.language) {
  const exact=state.model.i18n.has(material.id);
  if (exact) return localized(material.id,{language});
  let match, sourceKey='', templateKey='';
  if ((match=material.id.match(/^material_skin_fragment_c(\d+)_s(\d+)$/))) {
    sourceKey=`Character${Number(match[1])}_name_skin${Number(match[2])}`; templateKey='material_skin_fragment';
  } else if ((match=material.id.match(/^material_skin_fragment_(boss\d+)$/))) {
    sourceKey=match[1]; templateKey='material_skin_fragment';
  } else if (material.id === 'material_skin_fragment_shop') {
    sourceKey='bossshop'; templateKey='material_skin_fragment';
  } else if ((match=material.id.match(/^material_skill_(.+)_(\d+)$/))) {
    const charIndex=state.model.charCodes.findIndex(code => code.toLowerCase() === match[1].toLowerCase());
    if (charIndex >= 0) { sourceKey=`Character${charIndex}_skill_${Number(match[2])}_name`; templateKey='material_skill_fragment'; }
  } else if ((match=material.id.match(/^material_mech_fragment_(.+)$/))) {
    sourceKey=match[1]; templateKey='material_mech_fragment';
  } else if ((match=material.id.match(/^material_weapon_fragment_(weapon_.+)$/))) {
    sourceKey=`weapon/${match[1]}`;
    templateKey=state.model.i18n.has('weapon_blueprint_fragment_2')?'weapon_blueprint_fragment_2':'weapon_blueprint_fragment_1';
  }
  if (sourceKey && templateKey && state.model.i18n.has(sourceKey) && state.model.i18n.has(templateKey)) {
    const source=localized(sourceKey,{language}), template=localized(templateKey,{language});
    const text=formatTemplate(template.text,source.text);
    if (text) return {text,status:'inferred',key:material.id,sources:[sourceKey,templateKey]};
  }
  const aliases={
    material_choose_hero_1:'material_choose_hero', material_choose_hero_return_player_1:'material_choose_hero',
    material_choose_skin_1:'material_choose_skin', material_choose_skin_return_player_1:'material_choose_skin',
    material_season_treasure_box:'material_season_tresure_box'
  };
  let alias=aliases[material.id];
  if (!alias) {
    const candidate=material.id.replace(/(?:_?\d+)$/,'');
    if (candidate !== material.id && state.model.i18n.has(candidate)) alias=candidate;
  }
  if (alias && state.model.i18n.has(alias)) return {...localized(alias,{language}),status:'inferred',key:material.id,sources:[alias]};
  return {text:material.id,status:'unresolved',key:material.id};
}

function badge(status) {
  if (!status || status === 'exact' || status === 'alias') return null;
  const kind=/missing|unresolved|cycle/.test(status)?'error':/fallback|inferred/.test(status)?'warn':'';
  const label = status === 'inferred' ? t('badge_inferred') :
                status === 'missing' ? t('badge_missing') :
                status === 'unresolved' ? t('badge_unresolved') :
                status === 'English fallback' ? t('badge_english_fallback') :
                status === 'JSON fallback' ? t('badge_json_fallback') : status;
  return el('span',{class:`badge ${kind}`.trim(),text:label});
}

function characterDrawingUrls(code) {
  if (!state.snapshot?.sha) return [];
  const files = CHARACTER_DRAWINGS[code] || [];
  return files.map(file => `https://raw.githubusercontent.com/${REPO}/${state.snapshot.sha}/character_drawing/${encodeURIComponent(code)}/${encodeURIComponent(file)}`);
}

function characterDrawingCdnUrl(code) {
  return `https://cdn.chillyroom.com/game/soulknight/drawing_card/${encodeURIComponent(code)}/sprite_0.png`;
}

function createCharacterDrawingElement(code, alt='', className='char-drawing') {
  const container = el('div', {class: className});
  const githubUrl = characterDrawingUrls(code)[0];
  const spriteFallbackUrl = spriteUrl(code, 0);
  const img = el('img', {
    src: characterDrawingCdnUrl(code),
    alt: alt || code,
    class: 'char-drawing-img is-active',
    loading: 'lazy'
  });
  const fallbacks = [githubUrl, spriteFallbackUrl].filter((url, index, urls) => url && urls.indexOf(url) === index);
  let fallbackIndex = 0;
  img.onerror = () => {
    const fallback = fallbacks[fallbackIndex++];
    if (fallback) {
      img.src = fallback;
      img.classList.add('is-fallback');
    } else {
      img.style.display = 'none';
    }
  };
  container.append(img);
  return container;
}

function localizedSearch(key) {
  return [localized(key).text,localized(key,{language:'English'}).text];

function entitySearch(entity) {
  const values=[];
  if (entity.type==='characters') {
    values.push(entity.id,entity.code,...localizedSearch(`Character${entity.id}_name_skin0`));
    for (const id of [entity.starting,entity.upgraded]) values.push(id,...localizedSearch(`weapon/${id}`));
    for (const skinId of entity.skinIds) values.push(...localizedSearch(`Character${entity.id}_name_skin${skinId}`));
    for (const skillId of entity.skillIds) for (const suffix of ['name','info','x']) values.push(...localizedSearch(`Character${entity.id}_skill_${skillId}_${suffix}`));
  } else if (entity.type==='pets') { const a=petName(entity), b=petName(entity,'English'); values.push(entity.id,entity.code,a.text,b.text); }
  else if (entity.type==='weapons') { const a=weaponName(entity), b=weaponName(entity,'English'); values.push(entity.code,entity.level,entity.weaponType,a.text,b.text,entity.english); }
  else if (entity.type==='enemies') {
    values.push(entity.key,entity.enemyId,entity.enemyType,entity.bossWeapon,entity.subspeciesBoss,enemyName(entity).text,enemyName(entity,'English').text);
    const addDrop=drop=>values.push(drop.item,JSON.stringify(drop.conditions));
    entity.drops.forEach(addDrop); entity.dropGroups.forEach(group=>group.drops.forEach(addDrop));
  } else if (entity.type==='seeds') {
    const a=seedName(entity), b=seedName(entity,'English');
    values.push(entity.id,entity.level,a.text,b.text);
  } else if (entity.type==='blueprints') {
    values.push(entity.id,entity.itemId,entity.group,entity.localizationKey,blueprintName(entity).text,blueprintName(entity,'English').text);
    for (const cost of entity.materials) { const material=state.model.materials.find(value=>value.id===cost.item); values.push(cost.item,material?inferMaterial(material).text:'',material?inferMaterial(material,'English').text:''); }
  } else { const a=inferMaterial(entity); values.push(entity.id,entity.group,a.text); }
  return values.join(' ').toLocaleLowerCase();
}

function filtered(entities) {
  const query=state.search.trim().toLocaleLowerCase();
  return query ? entities.filter(entity => entitySearch(entity).includes(query)) : entities;
}

function renderCards(entities) {
  const shown=entities.slice(0,MAX_RESULTS);
  const isAllCharacters = shown.length > 0 && shown.every(e => e.type === 'characters');
  const grid=el('div',{class:isAllCharacters ? 'char-grid' : 'grid'});
  for (const entity of shown) {
    if (entity.type==='characters') {
      if (isAllCharacters) {
        grid.append(characterCard(entity));
      } else {
        const name=characterName(entity);
        const img=spriteImg(entity.code,0,name.text);
        grid.append(card(routeFor('characters',entity.id),name.text,`ID ${entity.id} · ${entity.code}`,name.status,img));
      }
    }
    else if (entity.type==='pets') { const name=petName(entity); grid.append(card(routeFor('pets',entity.id),name.text,`ID ${entity.id} · ${entity.code}`,name.status)); }
    else if (entity.type==='weapons') { const name=weaponName(entity); grid.append(card(routeFor('weapons',entity.code),name.text,`${entity.weaponType} · ${t('rarity_n',entity.level)} · ${entity.code}`,name.status,null,weaponRarityStyle(entity.level))); }
    else if (entity.type==='blueprints') { const name=blueprintName(entity); grid.append(card(routeFor('blueprints',entity.id),name.text,`${entity.group} · ${entity.id} · ${entity.itemId}`,name.status)); }
    else if (entity.type==='enemies') { const name=enemyName(entity); grid.append(card(routeFor('enemies',entity.key),name.text,`${entity.enemyType} · ${entity.key}${entity.enemyId?` · ${entity.enemyId}`:''}`,name.status)); }
    else if (entity.type==='seeds') { const name=seedName(entity); grid.append(card(routeFor('seeds',entity.id),name.text,`${t('rarity_n',entity.level)} · ${entity.id}`,name.status,null,weaponRarityStyle(entity.level))); }
    else { const name=inferMaterial(entity); grid.append(card(routeFor('materials',entity.id),name.text,`${t('rarity_n',entity.level ?? 0)} · ${entity.group} · ${entity.id}`,name.status,null,weaponRarityStyle(entity.level ?? 0))); }
  }
  const wrapper=el('div',{});
  if (entities.length>MAX_RESULTS) wrapper.append(el('p',{class:'muted',text:t('showing_matches',MAX_RESULTS,entities.length)}));
  wrapper.append(grid);
  return wrapper;
}

function chooseLanguage() {
  const requested=new URL(location.href).searchParams.get('lang');
  if (LANGUAGES.includes(requested)) return requested;
  const prefs=navigator.languages || [navigator.language];
  for (const pref of prefs) {
    const base=pref.toLowerCase();
    if (base.startsWith('zh-')) return /(?:hans|cn|sg)(?:-|$)/.test(base)?'Chinese (Simplified)':'Chinese (Traditional)';
    const found=LANGUAGES.find(lang=>languageCode(lang).toLowerCase()===base || languageCode(lang).toLowerCase().split('-')[0]===base.split('-')[0]);
    if (found) return found;
  }

}

function requestResult(request) { return new Promise((resolve,reject)=>{ request.onsuccess=()=>resolve(request.result); request.onerror=()=>reject(request.error); }); }
function transactionDone(tx) { return new Promise((resolve,reject)=>{ tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error || new Error('IndexedDB transaction aborted')); }); }

function openDatabase() {

    request.onupgradeneeded=()=>{ const db=request.result; if (!db.objectStoreNames.contains('snapshots')) db.createObjectStore('snapshots',{keyPath:'sha'}); if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta'); };
    request.onsuccess=()=>resolve(request.result); request.onerror=()=>reject(request.error);
  });
}

async function readCache() {
  if (!state.db) return null;
  const tx=state.db.transaction(['meta','snapshots'],'readonly'), meta=tx.objectStore('meta'), snapshots=tx.objectStore('snapshots');
  const pointers=await requestResult(meta.get('pointers')) || {};
  for (const sha of [pointers.current,pointers.previous]) {
    if (!sha) continue;
    const snapshot=await requestResult(snapshots.get(sha));
    if (!snapshot) continue;
    try { return {snapshot,model:buildModel(snapshot),slot:sha===pointers.current?'cache-current':'cache-previous'}; }
    catch (error) { console.warn(`Ignoring invalid cached snapshot ${sha}`,error); }
  }
  await transactionDone(tx);
  return null;
}

async function saveCache(snapshot) {
  if (!state.db) throw new Error('IndexedDB unavailable');
  const readTx=state.db.transaction('meta','readonly');
  const old=await requestResult(readTx.objectStore('meta').get('pointers')) || {};
  await transactionDone(readTx);
  const previous=old.current && old.current!==snapshot.sha ? old.current : old.previous;
  const keep=new Set([snapshot.sha,previous].filter(Boolean));
  const tx=state.db.transaction(['meta','snapshots'],'readwrite'), meta=tx.objectStore('meta'), snapshots=tx.objectStore('snapshots');
  snapshots.put(snapshot);
  meta.put({current:snapshot.sha,previous},'pointers');
  const keys=await requestResult(snapshots.getAllKeys());
  for (const key of keys) if (!keep.has(key)) snapshots.delete(key);
  await transactionDone(tx);
}

async function fetchWithLimit(url,limit,accept='text/plain',optional=false) {
  const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),30000);
  try {
    const response=await fetch(url,{headers:{Accept:accept},signal:controller.signal,cache:'no-store'});
    if (optional && response.status===404) return null;
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    const declared=Number(response.headers.get('content-length') || 0);
    if (declared>limit) throw new Error(`Response exceeds ${limit} bytes`);
    const bytes=await response.arrayBuffer();
    if (bytes.byteLength>limit) throw new Error(`Response exceeds ${limit} bytes`);
    return new TextDecoder().decode(bytes);
  } finally { clearTimeout(timer); }
}

async function fetchLatestSha() {
  try {
    const text=await fetchWithLimit(API_URL,1_000_000,'application/vnd.github+json');
    const data=parseJSON(text,'GitHub commit response'), sha=String(data.sha||'').toLowerCase();
    if (/^[0-9a-f]{40}$/.test(sha)) return sha;
  } catch (error) {
    console.warn(`Could not resolve commit SHA from GitHub API (${error.message}); falling back to branch ref ${BRANCH}`);
  }
  return BRANCH;
}

async function downloadSnapshot(sha) {
  const base=`https://raw.githubusercontent.com/${REPO}/${sha}/`;
  const optional=[BLUEPRINT_FILE,ENEMY_FILE,WEAPONS_CSV_FILE];
  const values=await Promise.all([...FILES.map(async name=>[name,await fetchWithLimit(base+name,LIMITS[name])]),...optional.map(async name=>[name,await fetchWithLimit(base+name,LIMITS[name],'text/plain',true)])]);
  return {sha,fetchedAt:new Date().toISOString(),blueprintFileChecked:true,enemyFileChecked:true,weaponFileChecked:true,files:Object.fromEntries(values.filter(([,value])=>value!==null))};
}

async function refresh(force=false) {
  if (state.refreshing) return;
  if (!force && Date.now()-state.lastCheck<REFRESH_MS) return;
  state.refreshing=true; refreshButton.disabled=true; setStatus(`Checking latest ${BRANCH} commit…`);
  try {
    const sha=await fetchLatestSha(); state.lastCheck=Date.now();
    if (state.snapshot?.sha===sha && state.snapshot.blueprintFileChecked && state.snapshot.enemyFileChecked && state.snapshot.weaponFileChecked) { state.sourceMode=state.sourceMode.startsWith('cache')?'cache, current':'network, current'; setStatus(`Current · game ${state.model.version} · ${sha.slice(0,12)}`); updateSource(); return; }

    const snapshot=await downloadSnapshot(sha), model=buildModel(snapshot);
    state.snapshot=snapshot; state.model=model; state.sourceMode='network'; render();
    if (!CAN_PERSIST) setStatus(`Updated live · game ${model.version} · ${sha.slice(0,12)}`);
    else try { await saveCache(snapshot); setStatus(`Updated and cached · game ${model.version} · ${sha.slice(0,12)}`); }
    catch (error) { console.warn('Fresh data could not be cached',error); setStatus(`Updated live; cache unavailable · ${error.message}`,'warn'); }
    updateSource();
  } catch (error) {
    console.error('Refresh failed',error);
    if (state.model) setStatus(`Using last valid data · refresh failed: ${error.message}`,'warn');
    else setStatus(`No wiki data available · ${error.message}`,'error');
  } finally { state.refreshing=false; refreshButton.disabled=false; }

  if (!parsedCSV.has('test_0') || parsedCSV.get('test_0').materials[0].item!=='mat_1' || parsedCSV.get('test_0').materials[0].num!==2 || parsedCSV.get('test_sub').originalWeapon!=='test_0' || parsedCSV.get('test_0').originalWeapon!==null || parsedCSV.get('test_0').fusionList[0].targetWeapon.weapon!=='test_fusion' || parsedCSV.get('test_0').fusionRangeList[0].targetWeapon.weapon!=='test_range_target') throw new Error('Weapons CSV self-check failed');
  const drop={item:{item:'material_test'},probability:150,guaranteeDrop:true,guaranteeDropCount:2,conditions:[{type:1}]};
  const group={probability:200,randomOrder:false,Drops:[drop]}, enemyRow=Array(23).fill('');
  Object.assign(enemyRow,{0:'ex_test',4:'e_test',12:'True',21:JSON.stringify([drop]),22:JSON.stringify([group])});
  const csvCell=value=>`"${String(value).replaceAll('"','""')}"`, enemy=parseEnemyCSV(`${ENEMY_HEADER.join(',')}\n${ENEMY_SCHEMA.map(csvCell).join(',')}\n${enemyRow.map(csvCell).join(',')}`).get('ex_test');
  if (enemy.enemyType!=='Boss' || enemy.drops[0].probability!==150 || enemy.dropGroups[0].drops[0].guaranteeDropCount!==2 || enemy.drops[0].conditions[0].type!==1 || enemyType('ex_test',false)!=='Elite' || enemyType('e_test',false)!=='Normal') throw new Error('Enemy self-check failed');
  rejected=false; try { const bad=[...enemyRow]; bad[12]='true'; parseEnemyCSV(`${ENEMY_HEADER.join(',')}\n${ENEMY_SCHEMA.map(csvCell).join(',')}\n${bad.map(csvCell).join(',')}`); } catch { rejected=true; } if (!rejected) throw new Error('Enemy validation self-check failed');
  const probe=el('div',{text:'<img src=x onerror=alert(1)>'}); if (probe.children.length || probe.textContent[0]!=='<') throw new Error('Safe rendering self-check failed');
}

async function init() {
  applyTheme(state.theme);
  try { runChecks(); }
  catch (error) { console.error(error); setStatus(`Internal self-check failed: ${error.message}`,'error'); app.replaceChildren(el('p',{text:'Wiki initialization stopped.'})); return; }
  state.language=chooseLanguage();
  for (const language of LANGUAGES) languageSelect.append(el('option',{value:language,text:language}));
  languageSelect.value=state.language;
  if (CAN_PERSIST) {
    try { state.db=await openDatabase(); }
    catch (error) { console.warn('IndexedDB unavailable',error); }
  }
  try {
    const cached=await readCache();
    if (cached) { state.snapshot=cached.snapshot; state.model=cached.model; state.sourceMode=cached.slot; setStatus(`Loaded cached game ${cached.model.version}; checking for updates…`,'warn'); render(); }
  } catch (error) { console.warn('Cache read failed',error); }
  updateSource();
  await refresh(true);
}

searchInput.addEventListener('input',()=>{ state.search=searchInput.value; render(); });
languageSelect.addEventListener('change',()=>setLanguage(languageSelect.value));
refreshButton.addEventListener('click',()=>refresh(true));
themeToggle.addEventListener('click',cycleTheme);
window.addEventListener('hashchange',()=>{ state.search=''; render(); app.focus({preventScroll:true}); });
window.addEventListener('online',()=>refresh());
document.addEventListener('visibilitychange',()=>{ if (!document.hidden) refresh(); });
setInterval(()=>{ if (!document.hidden) refresh(); },REFRESH_MS);
init();
</script>
</body>
